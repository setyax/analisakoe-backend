<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width:700px;">
                <h3 style="margin-top:0;" th:text="${isNew} ? 'New Chart of Account' : 'Edit Chart of Account'"></h3>

                <div th:if="${error}" style="background:#fee2e2;border:1px solid #dc2626;color:#7f1d1d;padding:10px;border-radius:6px;margin-bottom:15px;" th:text="${error}"></div>

                <form th:action="${isNew} ? @{/ui/coa} : @{/ui/coa/{id}(id=${coa.id})}" method="post">
                    <input type="hidden" name="id" th:if="${!isNew}" th:value="${coa.id}"/>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px;">
                        <div>
                            <label style="display:block;font-weight:bold;margin-bottom:5px;">Account Code</label>
                            <input type="text" name="code" required th:value="${coa != null ? coa.code : ''}" placeholder="1101" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;font-family:monospace;"/>
                            <small style="color:#64748b;font-size:11px;">Kode unik, biasanya 4 digit</small>
                        </div>
                        <div>
                            <label style="display:block;font-weight:bold;margin-bottom:5px;">Account Type</label>
                            <select name="accountType" required style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;">
                                <option value="ASSET" th:selected="${coa != null and coa.accountType == 'ASSET'}">ASSET (Aset)</option>
                                <option value="LIABILITY" th:selected="${coa != null and coa.accountType == 'LIABILITY'}">LIABILITY (Kewajiban)</option>
                                <option value="EQUITY" th:selected="${coa != null and coa.accountType == 'EQUITY'}">EQUITY (Ekuitas)</option>
                                <option value="REVENUE" th:selected="${coa != null and coa.accountType == 'REVENUE'}">REVENUE (Pendapatan)</option>
                                <option value="EXPENSE" th:selected="${coa != null and coa.accountType == 'EXPENSE'}">EXPENSE (Beban)</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block;font-weight:bold;margin-bottom:5px;">Account Name</label>
                        <input type="text" name="name" required th:value="${coa != null ? coa.name : ''}" placeholder="Kas Kecil, Bank BCA, Piutang Usaha, ..." style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px;">
                        <div>
                            <label style="display:block;font-weight:bold;margin-bottom:5px;">Parent Account (opsional)</label>
                            <select name="parentId" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;">
                                <option value="">-- Tidak ada (Top Level) --</option>
                                <option th:each="p : ${parents}" th:value="${p.id != null ? p.id : p[0]}" th:text="${p.code != null ? p.code : p[1]} + ' - ' + ${p.name != null ? p.name : p[2]}" th:selected="${coa != null and coa.parentId == (p.id != null ? p.id : p[0])}"></option>
                            </select>
                        </div>
                        <div>
                            <label style="display:block;font-weight:bold;margin-bottom:5px;">Status</label>
                            <select name="status" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;">
                                <option value="ACTIVE" th:selected="${coa == null or coa.status == 'ACTIVE'}">ACTIVE</option>
                                <option value="INACTIVE" th:selected="${coa != null and coa.status == 'INACTIVE'}">INACTIVE</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label><input type="checkbox" name="isHeader" value="true" th:checked="${coa != null and coa.isHeader}"/> 
                        <strong>Header Account</strong> (hanya untuk grouping, tidak bisa di-posting jurnal)</label>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block;font-weight:bold;margin-bottom:5px;">Currency (opsional)</label>
                        <select name="currency" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;">
                            <option value="">-- Default (IDR) --</option>
                            <option value="IDR" th:selected="${coa != null and coa.currency == 'IDR'}">IDR</option>
                            <option value="USD" th:selected="${coa != null and coa.currency == 'USD'}">USD</option>
                            <option value="SGD" th:selected="${coa != null and coa.currency == 'SGD'}">SGD</option>
                        </select>
                    </div>

                    <div style="margin-top:20px;">
                        <button type="submit" style="background:#10b981;color:white;padding:10px 25px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">💾 Simpan</button>
                        <a th:href="@{/ui/coa}" style="color:#64748b;text-decoration:none;margin-left:15px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
