<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3 style="margin-top:0; margin-bottom:10px;">[Purchasing] My Requests</h3>
                <div th:if="${success}" class="success-msg" th:text="${success}"></div>
                <div th:if="${error}" class="error-msg" th:text="${error}"></div>

                <table class="erp-table" style="margin-bottom: 15px; table-layout: fixed;">
                    <thead>
                        <tr>
                            <th style="width: 110px;">Doc No</th>
                            <th style="width: 95px;">Tanggal</th>
                            <th>Remarks</th>
                            <th style="width: 60px; text-align:center;">Item</th>
                            <th style="width: 105px;">Status</th>
                            <th style="width: 185px; text-align:center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${requests.isEmpty()}"><td colspan="6" class="center" style="padding:20px;">Belum ada permintaan. Buat lewat "+ New Request".</td></tr>
                        <tr th:each="p : ${requests}">
                            <td style="overflow:hidden; text-overflow:ellipsis;"><strong th:text="${p.docNo}"></strong></td>
                            <td th:text="${#temporals.format(p.docDate, 'dd-MM-yyyy')}"></td>
                            <td style="overflow:hidden; text-overflow:ellipsis;" th:text="${p.remarks} ?: '—'"></td>
                            <td style="text-align:center;" th:text="${p.details != null ? p.details.size() : 0}"></td>
                            <td><span class="badge" th:style="${p.status == 'DRAFT'} ? 'background:#f59e0b; color:white;' : (${p.status == 'CANCELLED'} ? 'background:#ef4444; color:white;' : 'background:#10b981; color:white;')" th:text="${p.status}"></span></td>
                            <td style="text-align:center; white-space:nowrap;">
                                <a th:if="${p.status == 'DRAFT'}" th:href="@{/ui/my-requests/{id}/edit(id=${p.id})}" style="background:#f59e0b; color:white; text-decoration:none; padding:3px 7px; font-size:10px;">Edit</a>
                                <form th:if="${p.status == 'DRAFT'}" th:action="@{/ui/my-requests/{id}/cancel(id=${p.id})}" method="post" style="display:inline-block; margin:0;"
                                      onsubmit="return confirm('Batalkan permintaan ini?')">
                                    <button type="submit" style="background:#64748b; color:white; border:none; cursor:pointer; padding:3px 7px; font-size:10px; width:auto !important;">Cancel</button>
                                </form>
                                <form th:if="${p.status == 'DRAFT' or p.status == 'CANCELLED'}" th:action="@{/ui/my-requests/{id}/delete(id=${p.id})}" method="post" style="display:inline-block; margin:0;"
                                      onsubmit="return confirm('Hapus permintaan ini?')">
                                    <button type="submit" style="background:#ef4444; color:white; border:none; cursor:pointer; padding:3px 7px; font-size:10px; width:auto !important;">Hapus</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div style="background: #f0f0f0; padding: 10px; border: 1px solid #a0a0a0;">
                    <a th:href="@{/ui/my-requests/new}" class="erp-btn-sm" style="text-decoration:none;">+ New Request</a>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
