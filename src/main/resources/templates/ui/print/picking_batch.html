<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consolidated Picking List</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; padding: 20px; }
        .header { border-bottom: 3px solid #1e40af; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .doc-title h1 { color: #1e40af; margin: 0; font-size: 22px; letter-spacing: 2px; }
        .info-box { background: #f8fafc; padding: 10px; border-left: 4px solid #1e40af; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #1e293b; color: white; padding: 8px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .check { width: 20px; height: 20px; border: 2px solid #000; display: inline-block; }
        .signatures { display: flex; justify-content: space-between; margin-top: 50px; }
        .sig-box { text-align: center; width: 200px; }
        .sig-line { border-top: 1px solid #000; margin-top: 60px; padding-top: 5px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <button class="no-print" onclick="window.print()" style="position:fixed; top:20px; right:20px; padding:10px 20px; background:#1e40af; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold; z-index:100;">🖨️ Cetak Picking List</button>

    <div class="header">
        <div>
            <h2 th:text="${company.name}">AnalisaKoe</h2>
            <div>Consolidated Picking Document</div>
        </div>
        <div class="doc-title">
            <h1>PICKING LIST (BATCH)</h1>
            <div>Tanggal Cetak: <span th:text="${#temporals.format(#temporals.createNow(), 'dd-MM-yyyy HH:mm')}"></span></div>
        </div>
    </div>

    <div class="info-box">
        <strong>Referensi DO yang Digabung:</strong>
        <ul style="margin: 5px 0 0 15px; padding: 0;">
            <li th:each="d : ${dos}">
                <span th:text="${d.docNo}"></span> - <span th:text="${d.customer}"></span> (<span th:text="${@dateFmt.format(d.docDate)}"></span>)
            </li>
        </ul>
    </div>

    <table>
        <thead>
            <tr>
                <th width="40">NO</th>
                <th width="100">KODE</th>
                <th>NAMA BARANG</th>
                <th width="100" style="text-align:right;">TOTAL QTY</th>
                <th width="80">UNIT</th>
                <th width="80" style="text-align:center;">✓ AMBIL</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="it, st : ${items}">
                <td th:text="${st.count}" style="text-align:center;">1</td>
                <td th:text="${it.code}">-</td>
                <td th:text="${it.name}">-</td>
                <td th:text="${@qtyDisplay.format(#numbers.formatDecimal(it.qty, 1, 'POINT', 0, 'COMMA'))}" style="text-align:right; font-weight:bold;">0</td>
                <td th:text="${it.uom}" style="text-align:center;">-</td>
                <td style="text-align:center;"><div class="check"></div></td>
            </tr>
        </tbody>
    </table>

    <div class="signatures">
        <div class="sig-box"><div>Picker</div><div class="sig-line">Nama & Tgl</div></div>
        <div class="sig-box"><div>Checker</div><div class="sig-line">Nama & Tgl</div></div>
    </div>
</body>
</html>
