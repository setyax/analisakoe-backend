<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width: 800px;">
                <h3 style="margin-top:0;" th:text="${isNew} ? 'Tambah User Baru' : 'Edit User & Hak Akses'"></h3>

                <form th:action="@{/ui/users/save}" method="post">
                    <input type="hidden" name="id" th:if="${!isNew and u != null}" th:value="${u.id}"/>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <!-- INFO USER -->
                        <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0;">
                            <h4 style="margin-top:0; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Informasi User</h4>
                            
                            <label style="display:block; font-weight:bold; margin:10px 0 5px;">Username</label>
                            <input type="text" name="username" required th:value="${!isNew and u != null ? u.username : ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                            
                            <label style="display:block; font-weight:bold; margin:10px 0 5px;">Email</label>
                            <input type="email" name="email" th:value="${!isNew and u != null ? u.email : ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                            
                            <label style="display:block; font-weight:bold; margin:10px 0 5px;">Nama Lengkap</label>
                            <input type="text" name="fullName" required th:value="${!isNew and u != null ? u.fullName : ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                            
                            <label style="display:block; font-weight:bold; margin:10px 0 5px;">Password <small th:if="${!isNew}" style="font-weight:normal;">(Kosongkan jika tidak diubah)</small></label>
                            <input type="password" name="password" th:required="${isNew}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                            
                            <label style="display:block; font-weight:bold; margin:10px 0 5px;">Status</label>
                            <select name="status" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                                <option value="ACTIVE" th:selected="${!isNew and u != null and u.status == 'ACTIVE'}">ACTIVE</option>
                                <option value="INACTIVE" th:selected="${!isNew and u != null and u.status == 'INACTIVE'}">INACTIVE</option>
                            </select>
                        </div>

                        <!-- HAK AKSES -->
                        <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0;">
                            <h4 style="margin-top:0; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Hak Akses Cabang (Company)</h4>
                            <div th:each="c : ${allCompanies}" style="margin-bottom: 8px;">
                                <input type="checkbox" name="companyIds" th:value="${c[0]}" th:id="'c_'+${c[0]}"
                                       th:checked="${userCompanies != null and #lists.contains(userCompanies, c[0])}" style="cursor:pointer;"/>
                                <label th:for="'c_'+${c[0]}" style="cursor:pointer;" th:text="${c[1] + (c[2] == 'ACTIVE' ? '' : ' (' + c[2] + ')')}"></label>
                            </div>

                            <label style="display:block; font-weight:bold; margin:15px 0 5px;">Company Default saat Login</label>
                            <select name="defaultCompanyId" id="defaultCompanySelect" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                                <option value="">- (pakai cabang pertama) -</option>
                                <option th:each="c : ${allCompanies}" th:value="${c[0]}" th:text="${c[1]}"
                                        th:selected="${defaultCompanyId != null and defaultCompanyId == c[0]}"></option>
                            </select>
                            <small style="color:#64748b;">Company inilah yang aktif otomatis saat user login. Hanya company yang dicentang di atas yang sebaiknya dipilih.</small>

                            <h4 style="margin-top:20px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Privilege Menu</h4>
                            <div th:each="p : ${allPermissions}" style="margin-bottom: 8px;">
                                <input type="checkbox" name="permissions" th:value="${p}" th:id="'p_'+${p}"
                                       th:checked="${userPerms != null and #lists.contains(userPerms, p)}" style="cursor:pointer;"/>
                                <label th:for="'p_'+${p}" style="cursor:pointer;" th:text="${p}"></label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <button type="submit" style="background:#10b981; color:white; padding:10px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Simpan Data</button>
                        <a th:href="@{/ui/users}" style="text-decoration:none; padding:10px 20px; color:#64748b; margin-left:10px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
