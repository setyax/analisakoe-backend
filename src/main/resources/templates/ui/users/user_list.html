<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
                    <h3 style="margin:0;">User Management</h3>
                    <a th:href="@{/ui/users/new}" style="background:#3b82f6; color:white; text-decoration:none; padding:8px 15px; border-radius:4px; font-weight:bold;">+ Tambah User</a>
                </div>

                <div th:if="${success}" style="background:#dcfce7; border:1px solid #16a34a; color:#14532d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${success}"></div>
                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <table class="erp-table" style="width: 100%; border-collapse: collapse; table-layout: fixed;">
                    <thead>
                        <tr style="background:#1e293b; color:white; text-align:left;">
                            <th style="padding:8px 10px; width:40px;">ID</th>
                            <th style="padding:8px 10px; width:90px;">USERNAME</th>
                            <th style="padding:8px 10px;">NAMA LENGKAP</th>
                            <th style="padding:8px 10px; width:70px;">STATUS</th>
                            <th style="padding:8px 10px;">EMAIL</th>
                            <th style="padding:8px 10px;">COMPANY DEFAULT</th>
                            <th style="padding:8px 6px; width:130px; text-align:center;">AKSI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}" style="border-bottom:1px solid #eee;">
                            <td style="padding:7px 10px;" th:text="${u[0]}"></td>
                            <td style="padding:7px 10px; font-weight:bold; overflow:hidden; text-overflow:ellipsis;" th:text="${u[1]}"></td>
                            <td style="padding:7px 10px; overflow:hidden; text-overflow:ellipsis;" th:text="${u[2]}"></td>
                            <td style="padding:7px 10px;" th:text="${u[3]}"></td>
                            <td style="padding:7px 10px; overflow:hidden; text-overflow:ellipsis;" th:text="${u[4] != null ? u[4] : '-'}"></td>
                            <td style="padding:7px 10px; overflow:hidden; text-overflow:ellipsis;" th:text="${u[5] != null ? u[5] : '-'}"></td>
                            <td style="padding:5px 4px; text-align:center; white-space:nowrap;">
                                <a th:href="@{/ui/users/{id}/edit(id=${u[0]})}" style="background:#f59e0b; color:white; text-decoration:none; padding:3px 7px; border-radius:4px; font-size:10px; font-weight:bold; display:inline-block; margin-right:2px;">Edit</a>
                                <form th:if="${u[0] != session.user.id}" th:action="@{/ui/users/{id}/delete(id=${u[0]})}" method="post" style="display:inline-block; margin:0;"
                                      onsubmit="return confirm('Hapus user ini beserta role, company, dan session-nya?')">
                                    <button type="submit" style="background:#ef4444; color:white; border:none; padding:3px 7px; border-radius:4px; font-size:10px; font-weight:bold; cursor:pointer; width:auto !important;">Hapus</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
