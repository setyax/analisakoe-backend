<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3 style="margin-top:0; margin-bottom:10px;"
                    th:text="${req != null ? '[HR & GA] Edit Employee Request — ' + req.docNo : '[HR & GA] New Employee Request'}"></h3>

                <form th:action="@{/ui/hr/employee-requests/save}" method="post" id="requestForm">
                    <input type="hidden" name="id" th:if="${req != null}" th:value="${req.id}"/>
                    <div class="erp-form-grid">
                        <label>Tanggal Request:</label>
                        <input type="date" name="docDate" th:value="${req != null and req.docDate != null ? req.docDate : today}" required>

                        <label>Karyawan:</label>
                        <select name="employeeId" required>
                            <option value="">-- Pilih Karyawan --</option>
                            <option th:each="e : ${employees}" th:value="${e[0]}" th:text="${e[1]}"
                                    th:selected="${req != null and #strings.toString(e[0]) == #strings.toString(req.employeeId)}"></option>
                        </select>

                        <label>Catatan / Keperluan:</label>
                        <textarea name="reason" style="width:50%; height:60px;" th:text="${req != null and req.reason != null ? req.reason : ''}"></textarea>
                    </div>

                    <table class="erp-table" id="itemTable">
                        <thead>
                            <tr>
                                <th style="width:30px; text-align:center;">No</th>
                                <th>Item / Barang</th>
                                <th style="width:160px;">Keterangan</th>
                                <th style="width:90px;">Qty</th>
                                <th style="width:90px;">UOM</th>
                                <th style="width:130px;">Tgl Dibutuhkan</th>
                                <th style="width:40px;">X</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="text-align:center;">1</td>
                                <td><select name="itemId" required style="width:100%;"><option value="">-- Pilih --</option><option th:each="i : ${items}" th:value="${i[0]}" th:text="${i[1]}"></option></select></td>
                                <td><input type="text" name="shortText" placeholder="Misal: untuk keperluan kantor" style="width:100%;"></td>
                                <td><input type="number" name="qty" step="0.01" min="0.01" required style="text-align:right;"></td>
                                <td><select name="uomId" required style="width:100%;"><option th:each="u : ${uoms}" th:value="${u[0]}" th:text="${u[1]}"></option></select></td>
                                <td><input type="date" name="deliveryDate" th:value="${today}" required style="width:100%;"></td>
                                <td style="text-align:center;"><button type="button" class="erp-btn" style="padding:2px 5px; margin:0;" onclick="this.closest('tr').remove(); updateNo();">X</button></td>
                            </tr>
                        </tbody>
                    </table>

                    <div style="margin-bottom:20px;">
                        <button type="button" class="erp-btn" onclick="addRow()">+ Tambah Item</button>
                    </div>

                    <div style="margin-top:20px; border-top:1px solid #a0a0a0; padding-top:15px;">
                        <button type="submit" class="erp-btn erp-btn-primary" style="padding:8px 30px; font-weight:bold;">Simpan</button>
                        <a th:href="@{/ui/hr/employee-requests}" class="erp-btn" style="text-decoration:none; display:inline-block; padding:8px 20px; margin-left:10px;">Batal</a>
                    </div>
                </form>
                <input type="hidden" id="prefillLines" th:if="${prefillLines != null}" th:value="${prefillLines}"/>
            </div>
        </section>
    </main>
</div>
<script>
    function addRow() {
        const tbody = document.querySelector('#itemTable tbody');
        const tr = tbody.querySelector('tr').cloneNode(true);
        tr.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
        tr.querySelector('input[name="shortText"]').value = '';
        tr.querySelector('input[name="qty"]').value = '';
        tbody.appendChild(tr);
        updateNo();
    }
    function updateNo() {
        document.querySelectorAll('#itemTable tbody tr').forEach((row, index) => { row.cells[0].innerText = index + 1; });
    }
    document.addEventListener('DOMContentLoaded', function () {
        const el = document.getElementById('prefillLines');
        if (!el || !el.value) return;
        const prefill = JSON.parse(el.value || '[]');
        if (!prefill.length) return;
        const tbody = document.querySelector('#itemTable tbody');
        const rows = tbody.querySelectorAll('tr');
        prefill.forEach((d, idx) => {
            let tr = idx < rows.length ? rows[idx] : null;
            if (!tr) { tr = rows[0].cloneNode(true); tbody.appendChild(tr); }
            const itemSel = tr.querySelector('select[name="itemId"]');
            for (const opt of itemSel.options) if (opt.value == d.itemId) { itemSel.value = opt.value; break; }
            const uomSel = tr.querySelector('select[name="uomId"]');
            for (const opt of uomSel.options) if (opt.value == d.uomId) { uomSel.value = opt.value; break; }
            tr.querySelector('input[name="shortText"]').value = d.shortText || '';
            tr.querySelector('input[name="qty"]').value = d.qty;
            tr.querySelector('input[name="deliveryDate"]').value = d.deliveryDate;
        });
        updateNo();
    });
</script>
</body>
</html>
