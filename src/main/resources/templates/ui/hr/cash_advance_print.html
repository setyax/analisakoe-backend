<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cetak Kas Bon</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 30px; }
        .info-table { width: 100%; margin-bottom: 30px; }
        .info-table td { padding: 8px; }
        .box { border: 1px solid #333; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 30px; }
        .signature { display: flex; justify-content: space-between; margin-top: 80px; text-align: center; }
        .signature div { width: 200px; border-top: 1px solid #333; padding-top: 10px; }
        @media print {
            body { padding: 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>

    <div class="no-print" style="margin-bottom: 20px; text-align: right;">
        <button onclick="window.print()" style="padding: 10px 20px; background: #0ea5e9; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">🖨️ Cetak Sekarang</button>
        <a href="javascript:window.close()" style="padding: 10px 20px; background: #ef4444; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-left: 10px;">Tutup</a>
    </div>

    <div class="header">
        <h2 style="margin: 0;">PT. ANALISAKOE ERP</h2>
        <p style="margin: 5px 0 0 0;">Bukti Pengajuan Kas Bon (Cash Advance)</p>
    </div>

    <table class="info-table">
        <tr>
            <td style="width: 20%; font-weight: bold;">No. Dokumen</td>
            <td style="width: 30%;" th:text="${ca.docNo}">-</td>
            <td style="width: 20%; font-weight: bold;">Tanggal</td>
            <td style="width: 30%;" th:text="${@dateFmt.format(ca.docDate)}">-</td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Nama Karyawan</td>
            <td th:text="${emp != null ? emp.name : '-'}">-</td>
            <td style="font-weight: bold;">NIK</td>
            <td th:text="${emp != null ? emp.nip : '-'}">-</td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Sumber Dana</td>
            <td th:text="${bank != null ? bank.name : 'Kas Kecil'}">-</td>
            <td style="font-weight: bold;">Status</td>
            <td th:text="${ca.status}">-</td>
        </tr>
    </table>

    <div class="box">
        <div style="font-size: 14px; font-weight: normal; margin-bottom: 10px;">NOMINAL PENGAJUAN</div>
        <span th:text="'Rp ' + ${#numbers.formatDecimal(ca.amount, 1, 'POINT', 2, 'COMMA')}">Rp 0,00</span>
    </div>

    <div>
        <p style="font-weight: bold; margin-bottom: 5px;">Keterangan / Keperluan:</p>
        <p style="border: 1px solid #ccc; padding: 10px; min-height: 60px;" th:text="${ca.remarks}">-</p>
    </div>

    <div class="signature">
        <div>
            <p>Pemohon,</p>
            <br/><br/><br/>
            <p th:text="${emp != null ? emp.name : '...................'}">Nama Karyawan</p>
        </div>
        <div>
            <p>Disetujui Oleh,</p>
            <br/><br/><br/>
            <p>(............................)</p>
        </div>
    </div>

</body>
</html>
