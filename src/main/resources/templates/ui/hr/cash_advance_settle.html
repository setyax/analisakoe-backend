<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0;">LPJ / Settlement Kas Bon</h3>
                    <a th:href="@{/ui/hr/cash-advance}" style="text-decoration:none; padding: 8px 15px; background:#64748b; color:white; border-radius:4px;">&larr; Kembali</a>
                </div>

                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <!-- INFO KAS BON -->
                <div style="background:#f8fafc; border:1px solid #e2e8f0; padding:15px; border-radius:6px; margin-bottom:20px;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <tr>
                            <td style="width: 20%; font-weight: bold; padding: 5px;">No. Dokumen</td>
                            <td style="width: 30%;" th:text="${ca.docNo}">-</td>
                            <td style="width: 20%; font-weight: bold; padding: 5px;">Tanggal Kas Bon</td>
                            <td style="width: 30%;" th:text="${@dateFmt.format(ca.docDate)}">-</td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; padding: 5px;">Karyawan</td>
                            <td th:text="${emp != null ? emp.nip + ' - ' + emp.name : ca.employeeId}">-</td>
                            <td style="font-weight: bold; padding: 5px;">Nominal Kas Bon</td>
                            <td style="font-weight: bold; color: #0f172a;" th:text="'Rp ' + ${#numbers.formatDecimal(ca.amount, 1, 'POINT', 2, 'COMMA')}">Rp 0</td>
                        </tr>
                    </table>
                </div>

                                <!-- FORM LPJ -->
                <form th:action="@{/ui/hr/cash-advance/{id}/settle(id=${ca.id})}" method="post" style="max-width: 800px;">
                    <h4 style="margin-top:0; border-bottom:1px solid #e2e8f0; padding-bottom:5px;">Form Pertanggungjawaban (LPJ)</h4>
                    
                    <div style="display:flex; gap:15px; margin-bottom:20px;">
                        <div style="flex:1;">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Tanggal Settlement</label>
                            <input type="date" name="settleDate" required th:value="${today}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                        </div>
                        <div style="flex:1;">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Sisa Uang Dikembalikan (Rp)</label>
                            <input type="number" step="0.01" name="returnAmount" required placeholder="0" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                        </div>
                    </div>

                    <!-- TABEL RINCIAN PENGELUARAN -->
                    <label style="display:block; font-weight:bold; margin-bottom:5px;">Rincian Pengeluaran (Nota)</label>
                    <table style="width:100%; border-collapse:collapse; margin-bottom:10px;" id="expenseTable">
                        <thead>
                            <tr style="background:#f1f5f9;">
                                <th style="padding:8px; border:1px solid #cbd5e1; text-align:left;">Keterangan Pengeluaran</th>
                                <th style="padding:8px; border:1px solid #cbd5e1; width:200px;">Nominal (Rp)</th>
                                <th style="padding:8px; border:1px solid #cbd5e1; width:50px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Baris awal -->
                            <tr>
                                <td style="padding:5px; border:1px solid #cbd5e1;"><input type="text" name="desc" placeholder="Contoh: Transportasi" required style="width:100%; padding:6px; border:none;"/></td>
                                <td style="padding:5px; border:1px solid #cbd5e1;"><input type="number" step="0.01" name="amt" placeholder="0" required style="width:100%; padding:6px; border:none; text-align:right;"/></td>
                                <td style="padding:5px; border:1px solid #cbd5e1; text-align:center;"><button type="button" onclick="removeRow(this)" style="color:red; border:none; background:none; cursor:pointer;">✖</button></td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <button type="button" onclick="addRow()" style="background:#e2e8f0; color:#0f172a; border:1px solid #cbd5e1; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:20px;">+ Tambah Baris Rincian</button>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Catatan Tambahan</label>
                        <input type="text" name="remarks" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-top:25px;">
                        <button type="submit" class="erp-btn erp-btn-primary" style="background:#10b981; color:white; padding: 10px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="return confirm('Simpan LPJ ini?');">
                            ✔️ Simpan LPJ & Lunas
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
<script>
    function addRow() {
        var table = document.getElementById("expenseTable").getElementsByTagName('tbody')[0];
        var newRow = table.insertRow();
        
        newRow.innerHTML = `
            <td style="padding:5px; border:1px solid #cbd5e1;"><input type="text" name="desc" placeholder="Keterangan..." required style="width:100%; padding:6px; border:none;"/></td>
            <td style="padding:5px; border:1px solid #cbd5e1;"><input type="number" step="0.01" name="amt" placeholder="0" required style="width:100%; padding:6px; border:none; text-align:right;"/></td>
            <td style="padding:5px; border:1px solid #cbd5e1; text-align:center;"><button type="button" onclick="removeRow(this)" style="color:red; border:none; background:none; cursor:pointer;">✖</button></td>
        `;
    }

    function removeRow(btn) {
        var row = btn.parentNode.parentNode;
        row.parentNode.removeChild(row);
    }
</script>
</body>
</html>
