<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width: 600px;">
                <h3 style="margin-top:0; margin-bottom:20px;" th:text="${isNew} ? 'Ajukan Kas Bon Baru' : 'Edit Kas Bon'">Form Kas Bon</h3>

                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <form th:action="${isNew} ? @{/ui/hr/cash-advance} : @{/ui/hr/cash-advance/{id}(id=${ca.id})}" method="post">
                    
                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Tanggal Kas Bon</label>
                        <input type="date" name="docDate" required th:value="${ca != null ? ca.docDate : today}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Karyawan</label>
                        <select name="employeeId" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                            <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.nip} + ' - ' + ${e.name}" th:selected="${ca != null and ca.employeeId == e.id}"></option>
                        </select>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Sumber Dana (Bank / Kas)</label>
                        <select name="bankId" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                            <option value="">-- Pilih Bank --</option>
                            <option th:each="b : ${banks}" th:value="${b.id}" th:text="${b.name}" th:selected="${ca != null and ca.bankId == b.id}"></option>
                        </select>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Nominal Kas Bon (Rp)</label>
                        <input type="number" step="0.01" name="amount" required th:value="${ca != null ? ca.amount : ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Keterangan / Keperluan</label>
                        <input type="text" name="remarks" th:value="${ca != null ? ca.remarks : ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-top:25px;">
                        <button type="submit" class="erp-btn erp-btn-primary" style="background:#3b82f6; color:white; padding: 10px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" th:text="${isNew} ? 'Simpan Kas Bon' : 'Update Kas Bon'">Simpan</button>
                        <a th:href="@{/ui/hr/cash-advance}" style="text-decoration:none; padding:10px 20px; color:#64748b; margin-left:10px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
