<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
                    <h3 style="margin:0;">Master Companies</h3>
                    <a th:href="@{/ui/master/companies/new}" class="erp-btn erp-btn-primary" style="background:#3b82f6; color:white; text-decoration:none; padding:8px 15px; border-radius:4px; font-weight:bold;">+ Tambah Company</a>
                </div>

                <div th:if="${success}" style="background:#dcfce7; border:1px solid #16a34a; color:#14532d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${success}"></div>
                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <table class="erp-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background:#1e293b; color:white; text-align:left;">
                            <th style="padding:12px;">ID</th>
                            <th style="padding:12px;">KODE</th>
                            <th style="padding:12px;">NAMA COMPANY</th>
                            <th style="padding:12px;">ALAMAT</th>
                            <th style="padding:12px;">TELEPON</th>
                            <th style="padding:12px;">EMAIL</th>
                            <th style="padding:12px;">STATUS</th>
                            <th style="padding:12px;">PEMAKAI</th>
                            <th style="padding:12px; text-align:center;">AKSI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${companies}" style="border-bottom:1px solid #eee;">
                            <td style="padding:12px;" th:text="${c[0]}"></td>
                            <td style="padding:12px; font-weight:bold;" th:text="${c[1]}"></td>
                            <td style="padding:12px;" th:text="${c[2]}"></td>
                            <td style="padding:12px;" th:text="${c[3]}"></td>
                            <td style="padding:12px;" th:text="${c[4]}"></td>
                            <td style="padding:12px;" th:text="${c[5]}"></td>
                            <td style="padding:12px;">
                                <span th:if="${c[6] == 'ACTIVE'}" style="background:#dcfce7; color:#14532d; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold;">ACTIVE</span>
                                <span th:if="${c[6] != 'ACTIVE'}" style="background:#fee2e2; color:#7f1d1d; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold;" th:text="${c[6]}"></span>
                            </td>
                            <td style="padding:12px; text-align:center;" th:text="${c[7]}"></td>
                            <td style="padding:12px; text-align:center;">
                                <a th:href="@{/ui/master/companies/{id}/edit(id=${c[0]})}" style="background:#f59e0b; color:white; text-decoration:none; padding:5px 10px; border-radius:4px; font-size:12px; font-weight:bold; margin-right:5px;">Edit</a>
                                <form th:action="@{/ui/master/companies/{id}/delete(id=${c[0]})}" method="post" style="display:inline-block; margin:0;" onsubmit="return confirm('Yakin hapus company ini?');">
                                    <button type="submit" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer;">Hapus</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
