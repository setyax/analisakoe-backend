<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width:600px;">
                <h3 th:text="${isNew} ? 'New Position' : 'Edit Position'"></h3>
                <form th:action="@{/ui/master/positions/save}" method="post">
                    <input type="hidden" name="id" th:if="${!isNew}" th:value="${c.id}"/>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Code</label>
                        <input type="text" name="code" required th:value="${!isNew ? c.code : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Name</label>
                        <input type="text" name="name" required th:value="${!isNew ? c.name : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Level</label>
                        <input type="number" name="level" th:value="${!isNew ? c.level : 1}" min="1" max="10" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/>
                        <small style="color:#64748b;">1=Staff, 2=Senior, 3=Manager, 4=Director</small></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Department</label>
                        <select name="departmentId" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;">
                            <option value="">-- Tidak ada --</option>
                            <option th:each="d : ${departments}" th:value="${d[0]}" th:text="${d[1]} + ' - ' + ${d[2]}" th:selected="${!isNew and c.departmentId == d[0]}"></option>
                        </select></div>
                    <div style="margin-bottom:15px;display:flex;gap:10px;">
                        <div style="flex:1;"><label style="font-weight:bold;">Min Salary</label>
                            <input type="number" step="0.01" name="minSalary" th:value="${!isNew ? c.minSalary : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                        <div style="flex:1;"><label style="font-weight:bold;">Max Salary</label>
                            <input type="number" step="0.01" name="maxSalary" th:value="${!isNew ? c.maxSalary : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    </div>
                    <div style="margin-bottom:15px;"><label><input type="checkbox" name="isActive" value="true" th:checked="${isNew or c.isActive}"/> Active</label></div>
                    <button type="submit" style="background:#10b981;color:white;padding:10px 20px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">Simpan</button>
                    <a th:href="@{/ui/master/positions}" style="color:#64748b;text-decoration:none;margin-left:10px;">Batal</a>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
