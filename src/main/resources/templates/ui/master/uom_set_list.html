<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <div style="display:flex;justify-content:space-between;margin-bottom:20px;align-items:center;">
                    <div>
                        <h3 style="margin:0;">[F0105] UoM Sets</h3>
                        <p style="margin:5px 0 0;color:#64748b;font-size:13px;">
                            Template konversi multi-level (packaging, berat, volume, dll)
                        </p>
                    </div>
                    <a th:href="@{/ui/master/uom-sets/new}" style="background:#3b82f6;color:white;text-decoration:none;padding:8px 15px;border-radius:4px;font-weight:bold;">+ New UoM Set</a>
                </div>

                <div th:if="${success}" style="background:#dcfce7;border:1px solid #16a34a;color:#14532d;padding:10px;border-radius:6px;margin-bottom:15px;" th:text="${success}"></div>
                <div th:if="${error}" style="background:#fee2e2;border:1px solid #dc2626;color:#7f1d1d;padding:10px;border-radius:6px;margin-bottom:15px;" th:text="${error}"></div>

                <table class="erp-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr style="background:#1e293b;color:white;text-align:left;">
                            <th style="padding:12px;">CODE</th>
                            <th style="padding:12px;">NAME</th>
                            <th style="padding:12px;">CATEGORY</th>
                            <th style="padding:12px;text-align:center;">LEVELS</th>
                            <th style="padding:12px;text-align:center;">ITEMS USING</th>
                            <th style="padding:12px;">STATUS</th>
                            <th style="padding:12px;text-align:center;">AKSI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${sets}" style="border-bottom:1px solid #eee;">
                            <td style="padding:12px;font-weight:bold;font-family:monospace;" th:text="${s[1]}"></td>
                            <td style="padding:12px;" th:text="${s[2]}"></td>
                            <td style="padding:12px;">
                                <span th:if="${s[3] != '-'}"
                                      th:style="${s[3] == 'PACKAGING' ? 'background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold;' : 
                                                (s[3] == 'WEIGHT' ? 'background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold;' : 
                                                (s[3] == 'VOLUME' ? 'background:#dcfce7;color:#14532d;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold;' : 
                                                (s[3] == 'LENGTH' ? 'background:#f3e8ff;color:#6b21a8;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold;' : 
                                                'background:#e2e8f0;color:#0f172a;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold;')))}"
                                      th:text="${s[3]}"></span>
                                <span th:if="${s[3] == '-'}" style="color:#64748b;">-</span>
                            </td>
                            <td style="padding:12px;text-align:center;font-weight:bold;" th:text="${detailCounts[s[0]] != null ? detailCounts[s[0]] : 0} + ' UoM'"></td>
                            <td style="padding:12px;text-align:center;">
                                <span th:text="${itemCounts[s[0]] != null ? itemCounts[s[0]] : 0} + ' item'" 
                                      th:style="${itemCounts[s[0]] != null and itemCounts[s[0]] > 0 ? 'color:#3b82f6;font-weight:bold;' : 'color:#64748b;'}"></span>
                            </td>
                            <td style="padding:12px;">
                                <span th:style="${s[5] == true ? 'background:#dcfce7;color:#14532d;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold;' : 'background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold;'}"
                                      th:text="${s[5] == true ? 'ACTIVE' : 'INACTIVE'}"></span>
                            </td>
                            <td style="padding:12px;text-align:center;white-space:nowrap;">
                                <a th:href="@{/ui/master/uom-sets/{id}/edit(id=${s[0]})}" 
                                   style="background:#f59e0b;color:white;padding:5px 10px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:bold;margin-right:3px;">Edit</a>
                                <form th:action="@{/ui/master/uom-sets/{id}/delete(id=${s[0]})}" method="post" style="display:inline;" onsubmit="return confirm('Hapus UoM Set ini?');">
                                    <button type="submit" style="background:#ef4444;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">Hapus</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${sets == null or sets.isEmpty()}">
                            <td colspan="7" style="padding:40px;text-align:center;color:#64748b;">
                                Belum ada UoM Set. Klik <strong>+ New UoM Set</strong> untuk memulai.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
