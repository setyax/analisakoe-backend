<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width:600px;">
                <h3 th:text="${isNew} ? 'New Salesperson' : 'Edit Salesperson'"></h3>
                <form th:action="@{/ui/master/salespersons/save}" method="post">
                    <input type="hidden" name="id" th:if="${!isNew}" th:value="${c.id}"/>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Code</label>
                        <input type="text" name="code" required th:value="${!isNew ? c.code : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Name</label>
                        <input type="text" name="name" required th:value="${!isNew ? c.name : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Employee (opsional)</label>
                        <select name="employeeId" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;">
                            <option value="">-- Tidak link ke employee --</option>
                            <option th:each="e : ${employees}" th:value="${e[0]}" th:text="${e[1]} + ' - ' + ${e[2]}" th:selected="${!isNew and c.employeeId == e[0]}"></option>
                        </select></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Commission (%)</label>
                        <input type="number" step="0.01" name="commissionPct" th:value="${!isNew ? c.commissionPct : 0}" min="0" max="100" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Phone</label>
                        <input type="text" name="phone" th:value="${!isNew ? c.phone : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    <div style="margin-bottom:15px;"><label style="font-weight:bold;">Email</label>
                        <input type="email" name="email" th:value="${!isNew ? c.email : ''}" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:4px;"/></div>
                    <div style="margin-bottom:15px;"><label><input type="checkbox" name="isActive" value="true" th:checked="${isNew or c.isActive}"/> Active</label></div>
                    <button type="submit" style="background:#10b981;color:white;padding:10px 20px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">Simpan</button>
                    <a th:href="@{/ui/master/salespersons}" style="color:#64748b;text-decoration:none;margin-left:10px;">Batal</a>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
