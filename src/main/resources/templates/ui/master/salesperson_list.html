<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                    <h3 style="margin:0;">Salespersons</h3>
                    <a th:href="@{/ui/master/salespersons/new}" style="background:#3b82f6;color:white;text-decoration:none;padding:8px 15px;border-radius:4px;font-weight:bold;">+ New</a>
                </div>
                <div th:if="${success}" style="background:#dcfce7;border:1px solid #16a34a;color:#14532d;padding:10px;border-radius:6px;margin-bottom:15px;" th:text="${success}"></div>
                <div th:if="${error}" style="background:#fee2e2;border:1px solid #dc2626;color:#7f1d1d;padding:10px;border-radius:6px;margin-bottom:15px;" th:text="${error}"></div>
                <table class="erp-table" style="width:100%;border-collapse:collapse;">
                    <thead><tr style="background:#1e293b;color:white;text-align:left;">
                        <th style="padding:12px;">CODE</th><th style="padding:12px;">NAME</th>
                        <th style="padding:12px;">PHONE</th><th style="padding:12px;">EMAIL</th>
                        <th style="padding:12px;">COMM %</th><th style="padding:12px;">ACTIVE</th>
                        <th style="padding:12px;text-align:center;">AKSI</th>
                    </tr></thead>
                    <tbody>
                        <tr th:each="it : ${items}" style="border-bottom:1px solid #eee;">
                            <td style="padding:12px;font-weight:bold;" th:text="${it[1]}"></td>
                            <td style="padding:12px;" th:text="${it[2]}"></td>
                            <td style="padding:12px;" th:text="${it[3]}"></td>
                            <td style="padding:12px;" th:text="${it[4]}"></td>
                            <td style="padding:12px;" th:text="${it[5]}"></td>
                            <td style="padding:12px;" th:text="${it[6]}"></td>
                            <td style="padding:12px;text-align:center;">
                                <a th:href="@{/ui/master/salespersons/{id}/edit(id=${it[0]})}" style="background:#f59e0b;color:white;padding:5px 10px;border-radius:4px;text-decoration:none;font-size:12px;margin-right:3px;">Edit</a>
                                <form th:action="@{/ui/master/salespersons/{id}/delete(id=${it[0]})}" method="post" style="display:inline;" onsubmit="return confirm('Hapus?');">
                                    <button type="submit" style="background:#ef4444;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;">Hapus</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
