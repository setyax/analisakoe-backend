<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width: 820px;">
                <h3 style="margin-top:0;" th:text="${isNew} ? 'Tambah Role Baru' : 'Edit Role & Permission'"></h3>

                <form th:action="@{/ui/roles/save}" method="post">
                    <input type="hidden" name="id" th:if="${!isNew and role != null}" th:value="${role.id}"/>

                    <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:15px;">
                        <div style="display:flex; gap:15px; margin-bottom:12px;">
                            <div style="flex:1;">
                                <label style="display:block; font-weight:bold; margin-bottom:5px;">Kode Role</label>
                                <input type="text" name="code" required
                                       th:value="${!isNew and role != null ? role.code : ''}"
                                       placeholder="Contoh: PURCHASING" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px; font-family:monospace;"/>
                                <small style="color:#64748b;">Huruf besar otomatis, tanpa spasi (contoh: PURCHASING, SALES_MGR).</small>
                            </div>
                            <div style="flex:1;">
                                <label style="display:block; font-weight:bold; margin-bottom:5px;">Nama Role</label>
                                <input type="text" name="name" required
                                       th:value="${!isNew and role != null ? role.name : ''}"
                                       placeholder="Contoh: Staf Pembelian" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                            </div>
                        </div>
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Deskripsi</label>
                        <textarea name="description" rows="2" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"
                                  th:text="${!isNew and role != null and role.description != null ? role.description : ''}"></textarea>
                    </div>

                    <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:15px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <h4 style="margin:0; font-size:14px;">Permission (Hak Akses)</h4>
                            <label style="font-size:12px; color:#475569; cursor:pointer;">
                                <input type="checkbox" id="checkAll" style="cursor:pointer; vertical-align:middle;"/> Centang semua
                            </label>
                        </div>

                        <div th:each="group : ${permGroups}" style="margin-bottom:12px;">
                            <div style="font-weight:bold; font-size:12px; color:#334155; text-transform:uppercase; border-bottom:1px solid #e2e8f0; padding-bottom:3px; margin-bottom:6px;"
                                 th:text="${group.key}"></div>
                            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:4px 12px;">
                                <label th:each="p : ${group.value}"
                                       style="font-size:12.5px; color:#475569; cursor:pointer; display:flex; align-items:center; gap:6px;">
                                    <input type="checkbox" name="permissionIds" th:value="${p.id}"
                                           th:checked="${selectedPermIds != null and selectedPermIds.contains(p.id)}"
                                           class="permCheck" style="cursor:pointer;"/>
                                    <span>
                                        <span style="font-family:monospace; font-size:11.5px;" th:text="${p.code}"></span>
                                        <span th:if="${p.description != null and !p.description.isEmpty()}" style="color:#94a3b8;" th:text="' — ' + ${p.description}"></span>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <button type="submit" style="background:#10b981; color:white; padding:9px 18px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Simpan Role</button>
                        <a th:href="@{/ui/roles}" style="text-decoration:none; padding:9px 18px; color:#64748b; margin-left:8px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<script>
    document.getElementById('checkAll').addEventListener('change', function(){
        document.querySelectorAll('.permCheck').forEach(function(cb){ cb.checked = document.getElementById('checkAll').checked; });
    });
</script>
</body>
</html>
