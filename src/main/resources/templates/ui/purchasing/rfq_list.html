<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                <h3 style="margin-top:0; margin-bottom:20px;">[F0201] Request for Quotation (RFQ)</h3>

                <div th:if="${success}" style="margin-bottom:10px; padding:10px; background:#dcfce7; color:#166534; border-radius:4px;" th:text="${success}"></div>
                <div th:if="${error}" style="margin-bottom:10px; padding:10px; background:#fee2e2; color:#991b1b; border-radius:4px;" th:text="${error}"></div>

                
<div style="margin:12px 0;padding:10px 12px;background:#eef4ff;border:1px solid #c7d7fe;border-radius:8px;display:inline-block;">
    <a th:href="@{/ui/purchasing/rfq/approval-matrix}" style="font-weight:600;text-decoration:none;color:#174ea6;">Setting RFQ Approval Matrix</a>
</div>
<table style="width:100%; border-collapse:collapse; font-size:13px; margin-bottom:20px;">
                    <thead>
                        <tr style="background-color:#1e293b; color:white;">
                            <th style="padding:10px;">TANGGAL</th>
                            <th style="padding:10px;">NO. RFQ</th>
                            <th style="padding:10px;">DUE DATE</th>
                            <th style="padding:10px; text-align:center;">SUPPLIER</th>
                            <th style="padding:10px; text-align:center;">ITEM</th>
                            <th style="padding:10px;">STATUS</th>
                            <th style="padding:10px; text-align:center; width:120px;">AKSI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(rfqs)}">
                            <td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">Belum ada data RFQ.</td>
                        </tr>
                        <tr th:each="r : ${rfqs}" style="border-bottom:1px solid #eee;">
                            <td style="padding:10px;" th:text="${r.docDate != null ? #temporals.format(r.docDate, 'dd-MM-yyyy') : '-'}"></td>
                            <td style="padding:10px; font-weight:bold;" th:text="${r.docNo}"></td>
                            <td style="padding:10px;" th:text="${r.dueDate != null ? #temporals.format(r.dueDate, 'dd-MM-yyyy') : '-'}"></td>
                            <td style="padding:10px; text-align:center;" th:text="${r.supplierCount}"></td>
                            <td style="padding:10px; text-align:center;" th:text="${r.itemCount}"></td>
                            <td style="padding:10px;">
                                <span th:styleappend="${r.status == 'CLOSED' ? 'background:#dcfce7; color:#166534;' : 
                      (r.status == 'VOID' ? 'background:#fee2e2; color:#991b1b;' : 
                      (r.status == 'QUOTED' ? 'background:#dbeafe; color:#1e40af;' : 
                      (r.status == 'PENDING_APPROVAL' ? 'background:#fffbeb; color:#b45309;' : 
                      (r.status == 'APPROVED' ? 'background:#ecfdf5; color:#047857;' : 'background:#e2e8f0; color:#475569;'))))}"
      style="padding:3px 10px; border-radius:12px; font-size:11px; font-weight:bold;"
      th:text="${r.status}"></span>
                            </td>
                            <td style="padding:10px; text-align:center;">
                                <a th:href="@{/ui/purchasing/rfq/{id}(id=${r.id})}" style="background:#3b82f6; color:white; padding:4px 10px; border-radius:3px; text-decoration:none; font-size:11px; font-weight:bold;">Detail</a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- TOMBOL DI LUAR TABEL AGAR SELALU MUNCUL -->
                <div>
                    <a th:href="@{/ui/purchasing/rfq/new}" style="background:#2563eb; color:white; padding:8px 20px; border-radius:4px; text-decoration:none; font-weight:bold;">+ New RFQ</a>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
