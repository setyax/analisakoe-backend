<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="margin:0;">3-Way Match — <span th:text="${poDocNo}"></span></h3>
                    <a th:href="@{/ui/purchasing/three-way-match}" style="background:#64748b; color:white; padding:8px 20px; border-radius:4px; text-decoration:none; font-weight:bold;">← Kembali</a>
                </div>

                <div th:if="${error}" style="margin-bottom:10px; padding:10px; background:#fee2e2; color:#991b1b; border-radius:4px;" th:text="${error}"></div>

                <div style="background:#f8fafc; padding:15px; border-radius:6px; margin-bottom:20px;">
                    <div style="display:grid; grid-template-columns:120px 1fr 120px 1fr; gap:8px; font-size:13px;">
                        <strong>Tanggal:</strong><span th:text="${poDate}"></span>
                        <strong>Supplier:</strong><span th:text="${supplierName}"></span>
                        <strong>Status PO:</strong><span th:text="${poStatus}"></span>
                        <strong>No. PO:</strong><span th:text="${poDocNo}"></span>
                    </div>
                </div>

                <div style="overflow-x:auto; border:1px solid #e2e8f0; border-radius:4px;">
                    <table style="width:100%; border-collapse:collapse; font-size:13px;">
                        <thead>
                            <tr style="background-color:#1e293b; color:white;">
                                <th style="padding:10px;">KODE</th>
                                <th style="padding:10px;">NAMA ITEM</th>
                                <th style="padding:10px; text-align:right;">QTY PO</th>
                                <th style="padding:10px; text-align:right;">QTY GRN</th>
                                <th style="padding:10px; text-align:right;">QTY INVOICE</th>
                                <th style="padding:10px; text-align:right;">SELISIH</th>
                                <th style="padding:10px; text-align:center;">STATUS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="it : ${items}" style="border-bottom:1px solid #eee;">
                                <td style="padding:10px; font-weight:bold;" th:text="${it.itemCode}"></td>
                                <td style="padding:10px;" th:text="${it.itemName}"></td>
                                <td style="padding:10px; text-align:right;"
                                    th:text="${#numbers.formatDecimal(it.poQty, 1, 'POINT', 2, 'COMMA') + ' ' + it.uomCode}"></td>
                                <td style="padding:10px; text-align:right;">
                                    <span th:text="${#numbers.formatDecimal(it.grnQty, 1, 'POINT', 2, 'COMMA') + ' ' + it.grnUom}"></span>
                                    <span th:if="${it.grnOtherQty != null and it.grnOtherQty.signum() > 0}"
                                          th:text="${'+ ' + #numbers.formatDecimal(it.grnOtherQty, 1, 'POINT', 2, 'COMMA') + ' ' + it.grnOtherUom + ' (unit berbeda)'}"
                                          style="color:#b45309; font-size:11px;"></span>
                                </td>
                                <td style="padding:10px; text-align:right;">
                                    <span th:text="${#numbers.formatDecimal(it.invQty, 1, 'POINT', 2, 'COMMA') + ' ' + it.uomCode}"></span>
                                    <span th:if="${it.invOtherQty != null and it.invOtherQty.signum() > 0}"
                                          th:text="${'+ ' + #numbers.formatDecimal(it.invOtherQty, 1, 'POINT', 2, 'COMMA') + ' ' + it.invOtherUom + ' (unit berbeda)'}"
                                          style="color:#991b1b; font-size:11px;"></span>
                                </td>
                                <td style="padding:10px; text-align:right; font-weight:bold;"
                                    th:text="${@qtyDisplay.format(#numbers.formatDecimal(it.poQty.subtract(it.invQty), 1, 'POINT', 2, 'COMMA')) + ' ' + it.uomCode}"></td>
                                <td style="padding:10px; text-align:center;">
                                    <span th:styleappend="${it.itemStatus == 'MATCH' ? 'background:#dcfce7; color:#166534;' : (it.itemStatus == 'PARTIAL' ? 'background:#fef3c7; color:#b45309;' : (it.itemStatus == 'OVER_RECEIVE' ? 'background:#dbeafe; color:#1e40af;' : 'background:#fee2e2; color:#991b1b;'))}"
                                          style="padding:4px 12px; border-radius:12px; font-size:11px; font-weight:bold;"
                                          th:text="${it.itemStatus}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
