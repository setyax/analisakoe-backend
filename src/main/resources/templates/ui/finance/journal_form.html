<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width: 800px; margin: 0 auto;">
                <h3 style="margin-top:0; margin-bottom:20px;">[F0702] New General Journal (Manual)</h3>
                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <form th:action="@{/ui/finance/journals/save}" method="post">
                    <div style="display:flex; flex-direction:column; gap:15px;">
                        <div style="display:flex; align-items:center;">
                            <label style="width:150px; font-weight:bold;">Tanggal Jurnal:</label>
                            <input type="date" name="docDate" th:value="${today}" required style="padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                        </div>
                        <div style="display:flex; align-items:center;">
                            <label style="width:150px; font-weight:bold;">Keterangan:</label>
                            <input type="text" name="remarks" required placeholder="Misal: Setoran Modal Awal" style="flex:1; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                        </div>

                        <hr style="width:100%; border:0; border-top:1px solid #eee;">

                        <div style="display:flex; align-items:center;">
                            <label style="width:150px; font-weight:bold; color:#16a34a;">Debit (Dr):</label>
                            <select name="debitAccountId" required style="flex:1; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                                <option value="">-- Pilih Akun Debit (Misal: Bank BCA) --</option>
                                <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.code} + ' - ' + ${a.name}"></option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <label style="width:150px; font-weight:bold; color:#dc2626;">Kredit (Cr):</label>
                            <select name="creditAccountId" required style="flex:1; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                                <option value="">-- Pilih Akun Kredit (Misal: Modal Disetor) --</option>
                                <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.code} + ' - ' + ${a.name}"></option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <label style="width:150px; font-weight:bold;">Nominal (Rp):</label>
                            <input type="number" name="amount" step="0.01" required style="padding:8px; border:1px solid #cbd5e1; border-radius:4px; font-weight:bold; color:#1e293b;">
                        </div>
                    </div>

                    <div style="margin-top:30px; text-align:right; border-top:1px solid #eee; padding-top:20px;">
                        <button type="submit" style="background:#2563eb; color:white; padding:10px 25px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">💾 Simpan Jurnal</button>
                        <a th:href="@{/ui/finance/journals}" style="background:#64748b; color:white; padding:10px 25px; border-radius:4px; text-decoration:none; font-weight:bold; margin-left:10px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
