<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px;">
                <h3 style="margin:0 0 15px 0;">[F0402] Laba Rugi (Income Statement)</h3>

                <div th:if="${error}" style="padding:10px; background:#fee2e2; color:#991b1b; border-radius:4px; margin-bottom:15px;" th:text="${error}"></div>

                <form method="get" action="/api/ui/finance/reports/income-statement" style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:20px; display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
                    <div>
                        <label style="display:block; font-weight:600; font-size:12px; margin-bottom:5px;">Dari Tanggal:</label>
                        <input type="date" name="startDate" th:value="${startDate}" required style="padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <div>
                        <label style="display:block; font-weight:600; font-size:12px; margin-bottom:5px;">Sampai Tanggal:</label>
                        <input type="date" name="endDate" th:value="${endDate}" required style="padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <button type="submit" style="padding:9px 20px; background:#2563eb; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">🔍 Tampilkan</button>
                    <button type="button" onclick="window.print()" style="padding:9px 20px; background:#059669; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-left:auto;">🖨️ Print</button>
                </form>

                <table style="width:100%; border-collapse:collapse; font-size:13px;">
                    <tbody>
                        <tr><td colspan="2" style="padding:10px; background:#dcfce7; font-weight:bold; font-size:14px;">PENDAPATAN (REVENUE)</td></tr>
                        <tr th:each="r : ${revenues}" style="border-bottom:1px solid #eee;">
                            <td style="padding:8px;" th:text="${r.code + ' - ' + r.name}">Kode - Nama</td>
                            <td style="padding:8px; text-align:right;" th:text="${#numbers.formatDecimal(r.saldo, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                        <tr style="background:#dcfce7; font-weight:bold;">
                            <td style="padding:10px;">TOTAL PENDAPATAN</td>
                            <td style="padding:10px; text-align:right;" th:text="${#numbers.formatDecimal(totalRevenue, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>

                        <tr><td colspan="2" style="padding:10px; background:#fee2e2; font-weight:bold; font-size:14px;">BEBAN (EXPENSES)</td></tr>
                        <tr th:each="e : ${expenses}" style="border-bottom:1px solid #eee;">
                            <td style="padding:8px;" th:text="${e.code + ' - ' + e.name}">Kode - Nama</td>
                            <td style="padding:8px; text-align:right;" th:text="${#numbers.formatDecimal(e.saldo, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                        <tr style="background:#fee2e2; font-weight:bold;">
                            <td style="padding:10px;">TOTAL BEBAN</td>
                            <td style="padding:10px; text-align:right;" th:text="${#numbers.formatDecimal(totalExpense, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>

                        <tr style="background:#1e293b; color:white; font-weight:bold; font-size:15px;">
                            <td style="padding:15px;">LABA (RUGI) BERSIH</td>
                            <td style="padding:15px; text-align:right;"
                                th:text="${#numbers.formatDecimal(netIncome, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
