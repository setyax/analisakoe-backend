<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3 style="margin-top:0; margin-bottom:10px;">[Finance] Investment Revaluation (FVTPL)</h3>
                <div th:if="${success}" class="success-msg" th:text="${success}"></div>
                <div th:if="${error}" class="error-msg" th:text="${error}"></div>

                <table class="erp-table" style="margin-bottom: 20px;">
                    <thead>
                        <tr><th>Kode</th><th>Nama Investasi</th><th style="text-align:right;">Nilai Tercatat (Book Value)</th><th>Aksi Revaluasi</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="inv : ${investments}">
                            <td><strong th:text="${inv.code}"></strong></td>
                            <td th:text="${inv.name}"></td>
                            <td style="text-align:right;" th:text="${#numbers.formatDecimal(inv.bookValue, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td>
                                <form th:action="@{/ui/finance/investments/revaluate}" method="post" style="display:flex; gap:5px; margin:0;">
                                    <input type="hidden" name="id" th:value="${inv.id}">
                                    <input type="date" name="revalDate" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required style="width:130px; padding:2px;">
                                    <input type="number" step="0.01" name="newFairValue" placeholder="Nilai Wajar Baru" required style="width:150px; padding:2px;">
                                    <button type="submit" class="erp-btn-sm" style="background:#3b82f6; padding:2px 10px;" onclick="return confirm('Lakukan revaluasi nilai wajar?')">Revaluasi</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
