<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3 style="margin-top:0; margin-bottom:20px;" th:text="${pageTitle}">Form Asset</h3>
                
                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <form th:action="${asset != null} ? @{/ui/finance/assets/{id}(id=${asset.id})} : @{/ui/finance/assets}" method="post" style="max-width: 600px;">
                    
                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Kode Aset</label>
                        <input type="text" name="assetCode" required th:value="${asset != null} ? ${asset.code} : ''" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Nama Aset</label>
                        <input type="text" name="assetName" required th:value="${asset != null} ? ${asset.name} : ''" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Kategori</label>
                        <input type="text" name="category" required th:value="${asset != null} ? ${asset.category} : ''" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-bottom:15px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Tanggal Perolehan</label>
                        <input type="date" name="acquisitionDate" required th:value="${asset != null} ? ${asset.acqDate} : ${today}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <div style="margin-bottom:15px; display:flex; gap:15px;">
                        <div style="flex:1;">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Nilai Perolehan</label>
                            <input type="number" name="acquisitionCost" step="0.01" min="0" required th:value="${asset != null} ? ${asset.acqCost} : ''" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                        </div>
                        <div style="flex:1;">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Nilai Residu</label>
                            <input type="number" name="salvageValue" step="0.01" min="0" required th:value="${asset != null} ? ${asset.salvage} : 0" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                        </div>
                    </div>

                    <div style="margin-bottom:15px; display:flex; gap:15px;">
                        <div style="flex:1;">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Umur Ekonomis (Tahun)</label>
                            <input type="number" name="usefulLifeYears" min="1" required th:value="${asset != null} ? ${asset.usefulLife} : ''" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                        </div>
                        <div style="flex:1;" th:if="${asset != null}">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Status</label>
                            <select name="status" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                                <option value="ACTIVE" th:selected="${asset.status == 'ACTIVE'}">ACTIVE</option>
                                <option value="INACTIVE" th:selected="${asset.status == 'INACTIVE'}">INACTIVE</option>
                                <option value="DISPOSED" th:selected="${asset.status == 'DISPOSED'}">DISPOSED</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top:25px;">
                        <button type="submit" class="erp-btn erp-btn-primary" th:text="${asset != null} ? 'Update Asset' : 'Simpan Asset'" style="padding: 10px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Simpan</button>
                        <a th:href="@{/ui/finance/assets}" style="text-decoration:none; padding:10px 20px; color:#64748b; margin-left:10px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
