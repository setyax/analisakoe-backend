<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                
                <h3 style="margin-top:0; margin-bottom:20px;">[Finance] AR Aging Report (Umur Piutang)</h3>

                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <table class="erp-table" style="width: 100%; border-collapse: collapse; font-size: 14px;">
                    <thead>
                        <tr style="background-color:#1e293b; color:white; text-align:left;">
                            <th style="padding:12px;">CUSTOMER</th>
                            <th style="padding:12px;">NO. INVOICE</th>
                            <th style="padding:12px;">TGL INVOICE</th>
                            <th style="padding:12px; text-align:right;">OUTSTANDING</th>
                            <th style="padding:12px; text-align:center;">UMUR (HARI)</th>
                            <th style="padding:12px; text-align:center;">KATEGORI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${agingData}" style="border-bottom:1px solid #eee;">
                            <td style="padding:12px;" th:text="${row[0]}">Customer</td>
                            <td style="padding:12px; font-weight:bold;" th:text="${row[1]}">No Invoice</td>
                            <td style="padding:12px;" th:text="${row[2]}">Date</td>
                            
                            <td style="padding:12px; text-align:right; font-weight:bold; color:#b91c1c;" 
                                th:text="'Rp ' + ${#numbers.formatDecimal(row[3], 1, 'POINT', 2, 'COMMA')}">0</td>
                            
                            <td style="padding:12px; text-align:center;" th:text="${row[4]}">0</td>
                            
                            <td style="padding:12px; text-align:center;">
                                <span style="background:#e2e8f0; padding:4px 10px; border-radius:12px; font-weight:bold; font-size:12px;" 
                                      th:text="${row[5]}">Kategori</span>
                            </td>
                        </tr>
                        <tr th:if="${agingData == null or agingData.isEmpty()}">
                            <td colspan="6" style="padding:30px; text-align:center; color:#64748b;">
                                Tidak ada piutang yang belum lunas.
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </section>
    </main>
</div>
</body>
</html>
