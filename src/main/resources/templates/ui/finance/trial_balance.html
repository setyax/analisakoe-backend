<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px;">
                <h3 style="margin:0 0 15px 0;">[F0403] Neraca Saldo (Trial Balance)</h3>

                <div th:if="${error}" style="padding:10px; background:#fee2e2; color:#991b1b; border-radius:4px; margin-bottom:15px;" th:text="${error}"></div>

                <form method="get" action="/api/ui/finance/reports/trial-balance" style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:20px; display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
                    <div>
                        <label style="display:block; font-weight:600; font-size:12px; margin-bottom:5px;">Dari Tanggal:</label>
                        <input type="date" name="startDate" th:value="${startDate}" required style="padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <div>
                        <label style="display:block; font-weight:600; font-size:12px; margin-bottom:5px;">Sampai Tanggal:</label>
                        <input type="date" name="endDate" th:value="${endDate}" required style="padding:8px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <button type="submit" style="padding:9px 20px; background:#2563eb; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">🔍 Tampilkan</button>
                    <button type="button" onclick="window.print()" style="padding:9px 20px; background:#059669; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer; margin-left:auto;">🖨️ Print</button>
                </form>

                <table style="width:100%; border-collapse:collapse; font-size:13px;">
                    <thead>
                        <tr style="background:#1e293b; color:white;">
                            <th style="padding:10px;">KODE</th>
                            <th style="padding:10px; text-align:left;">NAMA AKUN</th>
                            <th style="padding:10px;">TIPE</th>
                            <th style="padding:10px; text-align:right;">DEBIT</th>
                            <th style="padding:10px; text-align:right;">KREDIT</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${accounts}" style="border-bottom:1px solid #eee;">
                            <td style="padding:8px; font-weight:bold;" th:text="${a.code}"></td>
                            <td style="padding:8px;" th:text="${a.name}"></td>
                            <td style="padding:8px; text-align:center;">
                                <span th:text="${a.type}" style="padding:3px 8px; border-radius:10px; font-size:11px; background:#e2e8f0;"></span>
                            </td>
                            <td style="padding:8px; text-align:right;" th:text="${a.debit.compareTo(0) > 0 ? #numbers.formatDecimal(a.debit, 1, 'POINT', 2, 'COMMA') : '-'}"></td>
                            <td style="padding:8px; text-align:right;" th:text="${a.credit.compareTo(0) > 0 ? #numbers.formatDecimal(a.credit, 1, 'POINT', 2, 'COMMA') : '-'}"></td>
                        </tr>
                        <tr style="background:#1e293b; color:white; font-weight:bold; font-size:14px;">
                            <td colspan="3" style="padding:12px; text-align:right;">TOTAL</td>
                            <td style="padding:12px; text-align:right;" th:text="${#numbers.formatDecimal(totalDebit, 1, 'POINT', 2, 'COMMA')}">0</td>
                            <td style="padding:12px; text-align:right;" th:text="${#numbers.formatDecimal(totalCredit, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                    </tbody>
                </table>

                <div style="margin-top:20px; padding:15px; border-radius:4px; text-align:center; font-weight:bold; font-size:15px;"
                     th:styleappend="${totalDebit.compareTo(totalCredit) == 0 ? 'background:#ecfdf5; color:#047857; border-left:4px solid #059669;' : 'background:#fee2e2; color:#991b1b; border-left:4px solid #dc2626;'}">
                    <span th:if="${totalDebit.compareTo(totalCredit) == 0}">✅ BALANCE — Total Debit = Total Kredit</span>
                    <span th:unless="${totalDebit.compareTo(totalCredit) == 0}">⚠️ TIDAK BALANCE — Selisih: <span th:text="${#numbers.formatDecimal(totalDebit.subtract(totalCredit), 1, 'POINT', 2, 'COMMA')}"></span></span>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
