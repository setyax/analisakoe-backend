<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                <h3 style="margin-top:0; margin-bottom:20px;">[F0304] New Customer Receipt (AR Receipt)</h3>

                <div th:if="${error}" style="margin-bottom:10px; padding:10px; background:#fee2e2; color:#991b1b; border-radius:4px;" th:text="${error}"></div>

                <form th:action="@{/ui/finance/receipts}" method="post">

                    <!-- HEADER -->
                    <div style="display:grid; grid-template-columns:150px 1fr 150px 1fr; gap:15px; align-items:center; margin-bottom:25px; background:#f8fafc; padding:20px; border-radius:8px; border:1px solid #e2e8f0;">
                        <label style="font-weight:600;">Tanggal:</label>
                        <input type="date" name="docDate" th:value="${today}" required
                               style="padding:10px; border:1px solid #ddd; border-radius:4px;">

                        <label style="font-weight:600;">Customer:</label>
                        <select name="customerId" id="customerSelect" required style="padding:10px; border:1px solid #ddd; border-radius:4px;">
                            <option value="">-- Pilih Customer --</option>
                            <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}"
                                    th:selected="${selectedCustomerId != null and c.id == selectedCustomerId}"></option>
                        </select>

                        <label style="font-weight:600;">Bank / Kas:</label>
                        <select name="bankId" required style="padding:10px; border:1px solid #ddd; border-radius:4px;">
                            <option value="">-- Pilih Bank --</option>
                            <option th:each="b : ${banks}" th:value="${b.id}" th:text="${b.name}"></option>
                        </select>

                        <label style="font-weight:600;">Metode:</label>
                        <select name="paymentMethod" required style="padding:10px; border:1px solid #ddd; border-radius:4px;">
                            <option value="TRANSFER" selected>Transfer Bank</option>
                            <option value="CASH">Cash / Tunai</option>
                            <option value="CHECK">Cek</option>
                            <option value="GIRO">Giro</option>
                        </select>

                        <label style="font-weight:600;">No. Referensi:</label>
                        <input type="text" name="refNo" placeholder="No. Bukti Transfer / Cek"
                               style="padding:10px; border:1px solid #ddd; border-radius:4px;">

                        <label style="font-weight:600;">Remarks:</label>
                        <input type="text" name="remarks"
                               style="padding:10px; border:1px solid #ddd; border-radius:4px;">
                    </div>

                    <!-- TABLE INVOICE -->
                    <h4 style="color:#1e293b;">Pilih Invoice yang Akan Diterima</h4>
                    <div style="overflow-x:auto; border:1px solid #e2e8f0; border-radius:4px; margin-bottom:15px;">
                        <table id="invoiceTable" style="width:100%; border-collapse:collapse; font-size:13px;">
                            <thead>
                                <tr style="background-color:#1e293b; color:white;">
                                    <th style="padding:10px; width:40px;">✓</th>
                                    <th style="padding:10px;">NO. INVOICE</th>
                                    <th style="padding:10px;">CUSTOMER</th>
                                    <th style="padding:10px;">TGL INV</th>
                                    <th style="padding:10px; text-align:right;">TOTAL</th>
                                    <th style="padding:10px; text-align:right;">OUTSTANDING</th>
                                    <th style="padding:10px; text-align:right; width:150px;">JUMLAH TERIMA</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(invoices)}">
                                    <td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">
                                        Tidak ada invoice outstanding.
                                    </td>
                                </tr>
                                <tr th:each="inv : ${invoices}" style="border-bottom:1px solid #eee;"
                                    th:attr="data-customer-id=${inv.customerId}">
                                    <td style="padding:8px; text-align:center;">
                                        <input type="checkbox" class="inv-check"
                                               th:value="${inv.id}"
                                               th:attr="data-outstanding=${inv.outstanding}">
                                    </td>
                                    <td style="padding:8px; font-weight:bold;" th:text="${inv.docNo}"></td>
                                    <td style="padding:8px;" th:text="${inv.customer}"></td>
                                    <td style="padding:8px;" th:text="${inv.invoiceDate != null ? #temporals.format(inv.invoiceDate, 'dd-MM-yyyy') : '-'}"></td>
                                    <td style="padding:8px; text-align:right;"
                                        th:text="'Rp ' + ${#numbers.formatDecimal(inv.total ?: 0, 1, 'POINT', 2, 'COMMA')}"></td>
                                    <td style="padding:8px; text-align:right; color:#dc2626; font-weight:bold;"
                                        th:text="'Rp ' + ${#numbers.formatDecimal(inv.outstanding ?: 0, 1, 'POINT', 2, 'COMMA')}"></td>
                                    <td style="padding:8px;">
                                        <input type="hidden" th:name="invoiceId" th:value="${inv.id}" disabled>
                                        <input type="number" class="pay-input" th:name="payAmount"
                                               th:attr="data-inv-id=${inv.id}"
                                               th:value="${inv.outstanding ?: 0}"
                                               step="0.01" min="0" disabled
                                               style="width:100%; padding:6px; text-align:right; border:1px solid #ddd; border-radius:4px;">
                                    </td>
                                </tr>
                                <tr id="noDataRow" style="display:none;">
                                    <td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">
                                        Tidak ada invoice outstanding untuk customer ini.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- TOTAL -->
                    <div style="display:flex; justify-content:flex-end; gap:20px; margin-bottom:20px; font-size:16px;">
                        <div style="background:#f1f5f9; padding:12px 25px; border-radius:6px;">
                            <strong>Total Terima: </strong>
                            <span id="totalPay" style="color:#2563eb; font-weight:bold;">Rp 0</span>
                        </div>
                    </div>

                    <!-- ACTION -->
                    <div style="text-align:right; border-top:1px solid #eee; padding-top:20px;">
                        <button type="submit" style="padding:10px 30px; background:#2563eb; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">
                            💾 Save Receipt
                        </button>
                        <a th:href="@{/ui/finance/receipts}" style="padding:10px 30px; background:#64748b; color:white; border-radius:4px; text-decoration:none; font-weight:bold; margin-left:10px;">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<script>
    function recalc() {
        let total = 0;
        const table = document.getElementById('invoiceTable');
        if (!table) return;

        table.querySelectorAll('tbody tr[data-customer-id]').forEach(function(row) {
            const cb = row.querySelector('.inv-check');
            const payInput = row.querySelector('.pay-input');
            if (!cb || !payInput) return;

            const invIdInput = row.querySelector('input[type=hidden][name=invoiceId]');

            if (cb.checked) {
                payInput.disabled = false;
                if (invIdInput) invIdInput.disabled = false;
                let val = parseFloat(payInput.value);
                if (isNaN(val) || val === 0) {
                    const outstanding = parseFloat(cb.getAttribute('data-outstanding') || '0');
                    if (!isNaN(outstanding) && outstanding > 0) {
                        val = outstanding;
                        payInput.value = outstanding;
                    }
                }
                if (!isNaN(val)) total += val;
            } else {
                payInput.disabled = true;
                if (invIdInput) invIdInput.disabled = true;
            }
        });

        const totalEl = document.getElementById('totalPay');
        if (totalEl) totalEl.innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(Math.round(total));
    }

    function filterInvoicesByCustomer() {
        const customerSelect = document.getElementById('customerSelect');
        if (!customerSelect) return;
        const selectedId = customerSelect.value;
        const table = document.getElementById('invoiceTable');
        if (!table) return;

        const rows = table.querySelectorAll('tbody tr[data-customer-id]');
        let visibleCount = 0;

        rows.forEach(function(row) {
            const rowCustomerId = row.getAttribute('data-customer-id');
            if (!selectedId || rowCustomerId === selectedId) {
                row.style.display = '';
                visibleCount++;
            } else {
                row.style.display = 'none';
                const cb = row.querySelector('.inv-check');
                if (cb) cb.checked = false;
            }
        });

        const noDataRow = document.getElementById('noDataRow');
        if (noDataRow) noDataRow.style.display = (visibleCount === 0 && selectedId) ? '' : 'none';

        recalc();
    }

    document.addEventListener('DOMContentLoaded', function () {
        const table = document.getElementById('invoiceTable');
        if (!table) return;

        table.querySelectorAll('.inv-check').forEach(cb => cb.addEventListener('change', recalc));
        table.querySelectorAll('.pay-input').forEach(inp => inp.addEventListener('input', recalc));

        const customerSelect = document.getElementById('customerSelect');
        if (customerSelect) customerSelect.addEventListener('change', filterInvoicesByCustomer);

        filterInvoicesByCustomer();
    });

    document.querySelector('form').addEventListener('submit', function(e) {
        const customerSelect = document.getElementById('customerSelect');
        const selectedId = customerSelect ? customerSelect.value : '';

        if (!selectedId) {
            e.preventDefault();
            alert('Pilih Customer terlebih dahulu!');
            return;
        }

        const table = document.getElementById('invoiceTable');
        const checkedBoxes = table ? table.querySelectorAll('.inv-check:checked') : [];
        if (checkedBoxes.length === 0) {
            e.preventDefault();
            alert('Pilih minimal 1 invoice yang akan diterima pembayarannya!');
            return;
        }

        let hasInvalid = false;
        let invalidDocNos = [];
        checkedBoxes.forEach(function(cb) {
            const row = cb.closest('tr');
            if (!row) return;
            const rowCustomerId = row.getAttribute('data-customer-id');
            if (rowCustomerId !== selectedId) {
                hasInvalid = true;
                const cells = row.querySelectorAll('td');
                if (cells[1]) invalidDocNos.push(cells[1].innerText.trim());
            }
        });

        if (hasInvalid) {
            e.preventDefault();
            alert('❌ Ada invoice dari customer lain yang dicentang: ' + invalidDocNos.join(', '));
        }
    });
</script>
</body>
</html>
