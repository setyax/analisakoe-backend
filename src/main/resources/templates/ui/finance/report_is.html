<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3 style="margin-top:0; margin-bottom:10px;">[Finance] Income Statement (Laba Rugi)</h3>
                
                <form th:action="@{/ui/finance/reports/income-statement}" method="get" style="margin-bottom: 20px;">
                    <label style="display:inline-block; margin-right:15px;">Dari: <input type="date" name="start" th:value="${start}"></label>
                    <label style="display:inline-block; margin-right:15px;">Sampai: <input type="date" name="end" th:value="${end}"></label>
                    <button type="submit" class="erp-btn">Tampilkan</button>
                </form>

                <table class="erp-table" style="width: 70%;">
                    <tbody>
                        <tr><td colspan="2" style="background:#f0f0f0; font-weight:bold; font-size:16px;">PENDAPATAN (REVENUE)</td></tr>
                        <tr th:each="r : ${revenues}">
                            <td th:text="${r.accountCode} + ' - ' + ${r.accountName}"></td>
                            <td style="text-align:right;" th:text="${#numbers.formatDecimal(r.balance, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                        <tr style="font-weight:bold; border-top:1px solid #000;">
                            <td>Total Pendapatan</td>
                            <td style="text-align:right;" th:text="${#numbers.formatDecimal(totalRevenue, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                        
                        <tr><td colspan="2" style="background:#f0f0f0; font-weight:bold; font-size:16px; padding-top:20px;">BEBAN (EXPENSES)</td></tr>
                        <tr th:each="e : ${expenses}">
                            <td th:text="${e.accountCode} + ' - ' + ${e.accountName}"></td>
                            <td style="text-align:right;" th:text="${#numbers.formatDecimal(e.balance, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                        <tr style="font-weight:bold; border-top:1px solid #000;">
                            <td>Total Beban</td>
                            <td style="text-align:right;" th:text="${#numbers.formatDecimal(totalExpense, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                        
                        <tr style="font-weight:bold; background:#e6f7ff; font-size:16px; border-top:2px solid #000;">
                            <td>LABA / RUGI BERSIH</td>
                            <td style="text-align:right;" th:text="${#numbers.formatDecimal(netIncome, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
