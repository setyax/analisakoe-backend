<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3 style="margin-top:0; margin-bottom:10px;">[Sales] New Return</h3>
                <form th:action="@{/ui/sales/returns}" method="post">
                    <div class="erp-form-grid">
                        <label>Tanggal Retur:</label>
                        <input type="date" name="docDate" th:value="${today}" required>
                        
                        <label>Customer:</label>
                        <select name="customerId" required>
                            <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.code} + ' - ' + ${c.name}"></option>
                        </select>

                        <label>Gudang Penerima:</label>
                        <select name="warehouseId" required>
                            <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                        </select>
                    </div>

                    <table class="erp-table" id="itemTable" style="margin-bottom: 15px;">
                        <thead>
                            <tr><th>No</th><th>Item ID</th><th>Qty</th><th>Unit</th><th>Price</th><th>Total</th><th>X</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="text-align:center;">1</td>
                                <td><select name="itemId" required style="width:100%;"><option th:each="i : ${items}" th:value="${i.id}" th:text="${i.code} + ' - ' + ${i.name}"></option></select></td>
                                <td><input type="number" name="qty" step="0.01" min="0.01" required style="text-align:right;"></td>
                                <td><select name="uomId" required style="width:100%;"><option th:each="u : ${uoms}" th:value="${u.id}" th:text="${u.code}"></option></select></td>
                                <td><input type="number" name="price" step="0.01" min="0" required style="text-align:right;"></td>
                                <td><input type="text" name="gross" value="0,00" readonly style="text-align:right; background:#f0f0f0;"></td>
                                <td style="text-align:center;"><button type="button" class="erp-btn" onclick="this.closest('tr').remove(); updateNo();">X</button></td>
                            </tr>
                        </tbody>
                    </table>
                    <button type="button" class="erp-btn" onclick="addRow()" style="margin-bottom:20px;">+ Insert Baris</button>

                    <div style="margin-bottom: 20px;">
                        <label>Remarks:</label>
                        <textarea name="remarks" style="width: 50%; height: 60px;"></textarea>
                    </div>

                    <div style="border-top: 1px solid #a0a0a0; padding-top: 15px;">
                        <button type="submit" class="erp-btn erp-btn-primary" style="padding: 8px 30px;">Simpan Retur</button>
                        <a th:href="@{/ui/sales/returns}" class="erp-btn" style="text-decoration:none; padding: 8px 20px; margin-left:10px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
<script>
    function addRow() {
        const tbody = document.querySelector('#itemTable tbody');
        const tr = tbody.querySelector('tr').cloneNode(true);
        tr.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
        tr.querySelector('input[name="qty"]').value = '';
        tr.querySelector('input[name="price"]').value = '';
        tbody.appendChild(tr);
        updateNo();
    }
    function updateNo() {
        document.querySelectorAll('#itemTable tbody tr').forEach((row, index) => { row.cells[0].innerText = index + 1; });
    }
</script>
</body>
</html>
