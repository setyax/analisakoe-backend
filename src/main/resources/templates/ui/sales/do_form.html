<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width: 1000px;">
                <h3 style="margin-top:0; margin-bottom:20px;">[F0203] New Delivery Order</h3>

                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <form th:action="@{/ui/sales/do}" method="post">

                    <div style="margin-bottom:15px; display:flex; gap:15px;">
                        <div style="flex:1;">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Tanggal DO</label>
                            <input type="date" name="doDate" required th:value="${today}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                        </div>
                        <div style="flex:2;">
                            <label style="display:block; font-weight:bold; margin-bottom:5px;">Pilih SO (CONFIRMED)</label>
                            <select name="soId" id="soSelect" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                                <option value="">-- Pilih Sales Order --</option>
                                <option th:each="so : ${salesOrders}" 
                                        th:value="${so[0]}" 
                                        th:text="${so[1]} + ' - ' + ${so[2]} + ' [' + ${so[4]} + ']'">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-bottom:20px;">
                        <label style="display:block; font-weight:bold; margin-bottom:5px;">Remarks</label>
                        <input type="text" name="remarks" placeholder="(opsional)" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;"/>
                    </div>

                    <h4 style="border-bottom:2px solid #1e293b; padding-bottom:8px; margin-top:20px;">Item dari SO</h4>
                    
                    <div id="debugInfo" style="background:#fef3c7; border:1px solid #f59e0b; padding:8px 12px; border-radius:6px; margin-bottom:10px; font-size:12px;">
                        Silakan pilih SO di atas.
                    </div>
                    
                    <table style="width:100%; border-collapse:collapse; margin-bottom:20px;" id="itemTable">
                        <thead>
                            <tr style="background:#f1f5f9;">
                                <th style="padding:8px; border:1px solid #cbd5e1; text-align:center; width:40px;">NO</th>
                                <th style="padding:8px; border:1px solid #cbd5e1; text-align:left;">KODE</th>
                                <th style="padding:8px; border:1px solid #cbd5e1; text-align:left;">NAMA ITEM</th>
                                <th style="padding:8px; border:1px solid #cbd5e1; width:90px; text-align:center;">QTY DO</th>
                                <th style="padding:8px; border:1px solid #cbd5e1; width:70px; text-align:center;">UNIT</th>
                                <th style="padding:8px; border:1px solid #cbd5e1; width:80px; text-align:center; background:#dbeafe;">SISA</th>
                            </tr>
                        </thead>
                        <tbody id="itemBody">
                            <tr>
                                <td colspan="6" style="padding:20px; text-align:center; color:#64748b; border:1px solid #cbd5e1;">
                                    Pilih SO terlebih dahulu.
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div style="margin-top:20px; display:flex; gap:10px;">
                        <button type="submit" style="background:#3b82f6; color:white; padding:10px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">💾 Save DO (DRAFT)</button>
                        <a th:href="@{/ui/sales/do}" style="background:#64748b; color:white; padding:10px 20px; text-decoration:none; border-radius:4px; font-weight:bold;">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<script>
    (function() {
        var soSelect = document.getElementById('soSelect');
        var tbody = document.getElementById('itemBody');
        var debugInfo = document.getElementById('debugInfo');

        if (!soSelect || !tbody) {
            console.error('Element soSelect atau itemBody tidak ditemukan!');
            return;
        }

        soSelect.addEventListener('change', function() {
            var soId = this.value;
            console.log('SO dipilih:', soId);
            
            if (!soId) {
                tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; text-align:center; color:#64748b; border:1px solid #cbd5e1;">Pilih SO terlebih dahulu.</td></tr>';
                debugInfo.textContent = 'Silakan pilih SO di atas.';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; text-align:center; color:#64748b; border:1px solid #cbd5e1;">Memuat item...</td></tr>';
            debugInfo.textContent = 'Memuat item untuk SO id=' + soId + '...';

            fetch('/api/ui/sales/do/so-detail/' + soId)
                .then(function(response) {
                    console.log('Response status:', response.status);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    console.log('Response data:', data);
                    tbody.innerHTML = '';
                    
                    if (!data.success) {
                        tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; text-align:center; color:#dc2626; border:1px solid #cbd5e1;">Error: ' + (data.message || 'Tidak diketahui') + '</td></tr>';
                        debugInfo.textContent = 'Gagal: ' + (data.message || 'Error');
                        return;
                    }
                    
                    if (!data.items || data.items.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; text-align:center; color:#dc2626; border:1px solid #cbd5e1;">Tidak ada item sisa yang bisa dikirim untuk SO ini.</td></tr>';
                        debugInfo.textContent = 'SO valid tapi tidak ada item yang perlu dikirim (semua sudah di-DO).';
                        return;
                    }
                    
                    debugInfo.textContent = 'Berhasil memuat ' + data.items.length + ' item dari SO.';
                    
                    data.items.forEach(function(item, index) {
                        var tr = document.createElement('tr');
                        
                        // Buat setiap td secara eksplisit untuk menghindari parsing error
                        var tdNo = document.createElement('td');
                        tdNo.style.cssText = 'padding:8px; border:1px solid #cbd5e1; text-align:center;';
                        tdNo.textContent = index + 1;
                        
                        var tdCode = document.createElement('td');
                        tdCode.style.cssText = 'padding:8px; border:1px solid #cbd5e1;';
                        tdCode.textContent = item.itemCode || '-';
                        
                        var tdName = document.createElement('td');
                        tdName.style.cssText = 'padding:8px; border:1px solid #cbd5e1;';
                        tdName.textContent = item.itemName || '-';
                        
                        var tdQty = document.createElement('td');
                        tdQty.style.cssText = 'padding:8px; border:1px solid #cbd5e1; text-align:center;';
                        var qtyInput = document.createElement('input');
                        qtyInput.type = 'number';
                        qtyInput.name = 'qtys';
                        qtyInput.value = item.remainingQty;
                        qtyInput.min = '0.01';
                        qtyInput.max = item.remainingQty;
                        qtyInput.step = '0.01';
                        qtyInput.required = true;
                        qtyInput.style.cssText = 'width:80px; padding:4px; border:1px solid #cbd5e1; border-radius:4px; text-align:right;';
                        tdQty.appendChild(qtyInput);
                        
                        var tdUnit = document.createElement('td');
                        tdUnit.style.cssText = 'padding:8px; border:1px solid #cbd5e1; text-align:center;';
                        tdUnit.textContent = item.uomCode || '-';
                        
                        var tdSisa = document.createElement('td');
                        tdSisa.style.cssText = 'padding:8px; border:1px solid #cbd5e1; text-align:center; font-weight:bold; background:#dbeafe;';
                        tdSisa.textContent = item.remainingQty;
                        
                        var tdHidden = document.createElement('td');
                        tdHidden.style.display = 'none';
                        
                        var inItemId = document.createElement('input');
                        inItemId.type = 'hidden';
                        inItemId.name = 'itemIds';
                        inItemId.value = item.itemId;
                        tdHidden.appendChild(inItemId);
                        
                        var inUomId = document.createElement('input');
                        inUomId.type = 'hidden';
                        inUomId.name = 'uomIds';
                        inUomId.value = item.uomId || '';
                        tdHidden.appendChild(inUomId);
                        
                        var inPrice = document.createElement('input');
                        inPrice.type = 'hidden';
                        inPrice.name = 'prices';
                        inPrice.value = item.price || 0;
                        tdHidden.appendChild(inPrice);
                        
                        tr.appendChild(tdNo);
                        tr.appendChild(tdCode);
                        tr.appendChild(tdName);
                        tr.appendChild(tdQty);
                        tr.appendChild(tdUnit);
                        tr.appendChild(tdSisa);
                        tr.appendChild(tdHidden);
                        
                        tbody.appendChild(tr);
                    });
                })
                .catch(function(error) {
                    console.error('Fetch error:', error);
                    tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; text-align:center; color:#dc2626; border:1px solid #cbd5e1;">Gagal memuat: ' + error.message + '</td></tr>';
                    debugInfo.textContent = 'Error: ' + error.message;
                });
        });
    })();
</script>
</body>
</html>
