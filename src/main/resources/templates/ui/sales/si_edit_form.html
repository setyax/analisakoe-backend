<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="max-width: 1000px; margin: 0 auto;">
                <h3 style="margin-top:0; margin-bottom:20px;">[F0104] Edit Sales Invoice</h3>

                <div th:if="${error}" style="background:#fee2e2; border:1px solid #dc2626; color:#7f1d1d; padding:10px; border-radius:6px; margin-bottom:15px;" th:text="${error}"></div>

                <form th:action="@{/ui/sales/invoices/{id}(id=${invId})}" method="post">
                    <!-- HEADER INFO (Read Only) -->
                    <div style="display:grid; grid-template-columns: 180px 1fr; gap:10px; margin-bottom:20px; max-width:600px;">
                        <label style="font-weight:bold;">No. Invoice:</label>
                        <input type="text" th:value="${docNo}" readonly style="padding:8px; border:1px solid #cbd5e1; border-radius:4px; background:#f1f5f9;">

                        <label style="font-weight:bold;">Customer:</label>
                        <input type="text" th:value="${customerName}" readonly style="padding:8px; border:1px solid #cbd5e1; border-radius:4px; background:#f1f5f9;">

                        <label style="font-weight:bold;">Tgl Invoice:</label>
                        <input type="date" th:value="${invoiceDate}" readonly style="padding:8px; border:1px solid #cbd5e1; border-radius:4px; background:#f1f5f9;">

                        <label style="font-weight:bold;">Status:</label>
                        <input type="text" th:value="${status}" readonly style="padding:8px; border:1px solid #cbd5e1; border-radius:4px; background:#f1f5f9; font-weight:bold;">

                        <label style="font-weight:bold; color:#16a34a;">Jatuh Tempo:</label>
                        <input type="date" name="dueDate" th:value="${dueDate}" required style="padding:8px; border:2px solid #16a34a; border-radius:4px;">

                        <label style="font-weight:bold; color:#16a34a;">Remarks:</label>
                        <input type="text" name="remarks" th:value="${remarks}" placeholder="Keterangan tambahan..." style="padding:8px; border:2px solid #16a34a; border-radius:4px;">
                    </div>

                    <h4 style="margin-top:25px; color:#1e293b;">Detail Item (Read Only)</h4>
                    <table class="erp-table" style="width:100%; border-collapse:collapse; margin-bottom:15px;">
                        <thead>
                            <tr style="background:#1e293b; color:white;">
                                <th style="padding:10px; width:40px;">NO</th>
                                <th style="padding:10px;">KODE</th>
                                <th style="padding:10px;">NAMA ITEM</th>
                                <th style="padding:10px; text-align:right; width:100px;">QTY</th>
                                <th style="padding:10px; text-align:right; width:150px;">HARGA</th>
                                <th style="padding:10px; text-align:right; width:150px;">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${items.isEmpty()}">
                                <td colspan="6" style="text-align:center; padding:20px; color:#94a3b8;">Tidak ada detail item.</td>
                            </tr>
                            <tr th:each="it, st : ${items}" style="border-bottom:1px solid #eee;">
                                <td style="padding:8px; text-align:center;" th:text="${st.count}">1</td>
                                <td style="padding:8px;" th:text="${it.code}">-</td>
                                <td style="padding:8px;" th:text="${it.name}">-</td>
                                <td style="padding:8px; text-align:right;" th:text="${@qtyDisplay.format(it.qty)}">0</td>
                                <td style="padding:8px; text-align:right;" th:text="${#numbers.formatDecimal(it.price, 1, 'POINT', 2, 'COMMA')}">0</td>
                                <td style="padding:8px; text-align:right; font-weight:bold;" th:text="${#numbers.formatDecimal(it.total, 1, 'POINT', 2, 'COMMA')}">0</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr style="background:#f8fafc; font-weight:bold;">
                                <td colspan="5" style="padding:12px; text-align:right;">Subtotal:</td>
                                <td style="padding:12px; text-align:right;" th:text="${#numbers.formatDecimal(totalAmount - taxAmount, 1, 'POINT', 2, 'COMMA')}">0</td>
                            </tr>
                            <tr style="background:#f8fafc; font-weight:bold;">
                                <td colspan="5" style="padding:12px; text-align:right;">PPN:</td>
                                <td style="padding:12px; text-align:right;" th:text="${#numbers.formatDecimal(taxAmount, 1, 'POINT', 2, 'COMMA')}">0</td>
                            </tr>
                            <tr style="background:#1e293b; color:white; font-weight:bold;">
                                <td colspan="5" style="padding:12px; text-align:right;">TOTAL:</td>
                                <td style="padding:12px; text-align:right;" th:text="${#numbers.formatDecimal(totalAmount, 1, 'POINT', 2, 'COMMA')}">0</td>
                            </tr>
                        </tfoot>
                    </table>

                    <div style="background:#fef3c7; border:1px solid #f59e0b; padding:12px; border-radius:6px; margin-bottom:20px; font-size:13px;">
                        ⚠️ <strong>Info:</strong> Hanya <strong>Jatuh Tempo</strong> dan <strong>Remarks</strong> yang bisa diedit. Untuk mengubah item/qty/harga, void invoice ini dan buat baru.
                    </div>

                    <div style="text-align:right; border-top:1px solid #eee; padding-top:20px;">
                        <button type="submit" style="background:#2563eb; color:white; padding:10px 25px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">💾 Simpan Perubahan</button>
                        <a th:href="@{/ui/sales/invoices}" style="background:#64748b; color:white; padding:10px 25px; border-radius:4px; text-decoration:none; font-weight:bold; margin-left:10px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
