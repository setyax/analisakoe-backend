<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="margin:0;">Quotation — <span th:text="${qDocNo}"></span></h3>
                    <span th:styleappend="${qStatus == 'DRAFT' ? 'background:#e2e8f0; color:#475569;' : (qStatus == 'SENT' ? 'background:#dbeafe; color:#1e40af;' : (qStatus == 'ACCEPTED' ? 'background:#dcfce7; color:#166534;' : (qStatus == 'CONVERTED' ? 'background:#f0abfc; color:#86198f;' : (qStatus == 'REJECTED' ? 'background:#fee2e2; color:#991b1b;' : 'background:#e2e8f0; color:#64748b;'))))}"
                          style="padding:5px 15px; border-radius:12px; font-weight:bold;" th:text="${qStatus}"></span>
                </div>

                <div th:if="${success}" style="margin-bottom:10px; padding:10px; background:#dcfce7; color:#166534; border-radius:4px;" th:text="${success}"></div>
                <div th:if="${error}" style="margin-bottom:10px; padding:10px; background:#fee2e2; color:#991b1b; border-radius:4px;" th:text="${error}"></div>

                <div style="background:#f8fafc; padding:15px; border-radius:6px; margin-bottom:20px;">
                    <div style="display:grid; grid-template-columns:120px 1fr 120px 1fr; gap:8px; font-size:13px;">
                        <strong>Tanggal:</strong><span th:text="${@dateFmt.format(qDate)}"></span>
                        <strong>Valid Until:</strong><span th:text="${qValidUntil}"></span>
                        <strong>Customer:</strong><span th:text="${qCustomer}"></span>
                        <strong>Currency:</strong><span th:text="${qCurrency}"></span>
                        <strong>Tax:</strong><span th:text="${qTaxType}"></span>
                        <strong>Remarks:</strong><span th:text="${qRemarks != null ? qRemarks : '-'}"></span>
                    </div>
                </div>

                <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
                    <thead>
                        <tr style="background:#1e293b; color:white;">
                            <th style="padding:10px;">KODE</th>
                            <th style="padding:10px;">NAMA</th>
                            <th style="padding:10px; text-align:right;">QTY</th>
                            <th style="padding:10px;">UNIT</th>
                            <th style="padding:10px; text-align:right;">HARGA</th>
                            <th style="padding:10px; text-align:right;">SUBTOTAL</th>
                            <th style="padding:10px; text-align:right;">PPN</th>
                            <th style="padding:10px; text-align:right;">TOTAL</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="it : ${items}" style="border-bottom:1px solid #eee;">
                            <td style="padding:8px;" th:text="${it.itemCode}"></td>
                            <td style="padding:8px;" th:text="${it.itemName}"></td>
                            <td style="padding:8px; text-align:right;" th:text="${@qtyDisplay.format(#numbers.formatDecimal(it.qty, 1, 'POINT', 2, 'COMMA'))}"></td>
                            <td style="padding:8px;" th:text="${it.uomCode}"></td>
                            <td style="padding:8px; text-align:right;" th:text="${#numbers.formatDecimal(it.price, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td style="padding:8px; text-align:right;" th:text="${#numbers.formatDecimal(it.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td style="padding:8px; text-align:right;" th:text="${#numbers.formatDecimal(it.tax, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td style="padding:8px; text-align:right; font-weight:bold;" th:text="${#numbers.formatDecimal(it.total, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                        <tr style="background:#f1f5f9; font-weight:bold;">
                            <td colspan="5" style="padding:10px; text-align:right;">TOTAL:</td>
                            <td colspan="3" style="padding:10px; text-align:right; font-size:14px;"
                                th:text="${qCurrency} + ' ' + ${#numbers.formatDecimal(qTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                    </tbody>
                </table>

                <!-- ACTION BAR -->
                <div style="display:flex; gap:8px; flex-wrap:wrap; padding:15px; background:#f8fafc; border-radius:6px;">
                    <a th:href="@{/ui/sales/quotations}" style="background:#64748b; color:white; padding:8px 20px; border-radius:4px; text-decoration:none; font-weight:bold;">← Kembali</a>

                    <a th:href="@{/ui/print/quotation/{id}(id=${quotationId})}" target="_blank"
                       style="background:#0ea5e9; color:white; padding:8px 20px; border-radius:4px; text-decoration:none; font-weight:bold;">🖨️ Print SPH</a>

                    <!-- SEND -->
                    <form th:if="${qStatus == 'DRAFT'}" th:action="@{/ui/sales/quotations/{id}/send(id=${quotationId})}" method="post" style="display:inline;">
                        <button type="submit" style="background:#3b82f6; color:white; padding:8px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="return confirm('Tandai sebagai sudah dikirim ke customer?');">
                            📤 Send to Customer
                        </button>
                    </form>

                    <!-- ACCEPT -->
                    <form th:if="${qStatus == 'SENT'}" th:action="@{/ui/sales/quotations/{id}/accept(id=${quotationId})}" method="post" style="display:inline;">
                        <button type="submit" style="background:#10b981; color:white; padding:8px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="return confirm('Customer setuju dengan penawaran ini?');">
                            ✅ Customer Accept
                        </button>
                    </form>

                    <!-- REJECT -->
                    <form th:if="${qStatus == 'SENT'}" th:action="@{/ui/sales/quotations/{id}/reject(id=${quotationId})}" method="post" style="display:inline;">
                        <button type="submit" style="background:#dc2626; color:white; padding:8px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="return confirm('Customer menolak penawaran ini?');">
                            ❌ Customer Reject
                        </button>
                    </form>

                    <!-- CONVERT TO SO -->
                    <form th:if="${qStatus == 'ACCEPTED'}" th:action="@{/ui/sales/quotations/{id}/convert-to-so(id=${quotationId})}" method="post" style="display:inline;">
                        <button type="submit" style="background:#8b5cf6; color:white; padding:8px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="return confirm('Convert Quotation ini ke Sales Order?');">
                            🎯 Convert to SO
                        </button>
                    </form>

                    <!-- GO TO SO -->
                    <a th:if="${qStatus == 'CONVERTED' and convertedSoId != null}" 
                       th:href="@{/ui/sales/orders/{id}/edit(id=${convertedSoId})}"
                       style="background:#7c3aed; color:white; padding:8px 20px; border-radius:4px; text-decoration:none; font-weight:bold;">
                       📄 Lihat SO
                    </a>

                    <!-- VOID -->
                    <form th:if="${qStatus != 'CONVERTED' and qStatus != 'VOID'}" th:action="@{/ui/sales/quotations/{id}/void(id=${quotationId})}" method="post" style="display:inline; margin-left:auto;">
                        <button type="submit" style="background:#6b7280; color:white; padding:8px 20px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="return confirm('Void Quotation ini?');">
                            🚫 Void
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
