<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                <h3 style="margin-top:0; margin-bottom:20px;">[F0101] Sales Quotation (SPH)</h3>

                <div th:if="${success}" style="margin-bottom:10px; padding:10px; background:#dcfce7; color:#166534; border-radius:4px;" th:text="${success}"></div>
                <div th:if="${error}" style="margin-bottom:10px; padding:10px; background:#fee2e2; color:#991b1b; border-radius:4px;" th:text="${error}"></div>

                <div style="margin-bottom:15px;">
                    <input type="text" id="searchInput" placeholder="🔍 Cari data (No SPH, Customer, Status)..." 
                           style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:4px;">
                </div>

                <div style="overflow-x:auto; border:1px solid #e2e8f0; border-radius:4px; margin-bottom:20px;">
                    <table id="qTable" style="width:100%; border-collapse:collapse; font-size:13px;">
                        <thead>
                            <tr style="background-color:#1e293b; color:white;">
                                <th style="padding:10px;">TANGGAL</th>
                                <th style="padding:10px;">NO. SPH</th>
                                <th style="padding:10px;">CUSTOMER</th>
                                <th style="padding:10px;">VALID UNTIL</th>
                                <th style="padding:10px; text-align:right;">TOTAL</th>
                                <th style="padding:10px;">STATUS</th>
                                <th style="padding:10px; text-align:center; width:150px;">AKSI</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(quotations)}">
                                <td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">Belum ada data Quotation.</td>
                            </tr>
                            <tr th:each="q : ${quotations}" style="border-bottom:1px solid #eee;">
                                <td style="padding:10px;" th:text="${q.docDate != null ? #temporals.format(q.docDate, 'dd-MM-yyyy') : '-'}"></td>
                                <td style="padding:10px; font-weight:bold;" th:text="${q.docNo}"></td>
                                <td style="padding:10px;" th:text="${q.customerName}"></td>
                                <td style="padding:10px;" th:text="${q.validUntil != null ? #temporals.format(q.validUntil, 'dd-MM-yyyy') : '-'}"></td>
                                <td style="padding:10px; text-align:right; font-weight:bold;"
                                    th:text="${q.currency} + ' ' + ${#numbers.formatDecimal(q.totalAmount, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td style="padding:10px;">
                                    <span th:styleappend="${q.status == 'DRAFT' ? 'background:#e2e8f0; color:#475569;' : (q.status == 'SENT' ? 'background:#dbeafe; color:#1e40af;' : (q.status == 'ACCEPTED' ? 'background:#dcfce7; color:#166534;' : (q.status == 'CONVERTED' ? 'background:#f0abfc; color:#86198f;' : (q.status == 'REJECTED' ? 'background:#fee2e2; color:#991b1b;' : 'background:#e2e8f0; color:#64748b;'))))}"
                                          style="padding:3px 10px; border-radius:12px; font-size:11px; font-weight:bold;"
                                          th:text="${q.status}"></span>
                                </td>
                                <td style="padding:10px; text-align:center; white-space:nowrap;">
                                    <a th:href="@{/ui/sales/quotations/{id}(id=${q.id})}"
                                       style="background:#3b82f6; color:white; padding:4px 10px; border-radius:3px; text-decoration:none; font-size:11px; font-weight:bold; margin-right:2px;">
                                       Detail
                                    </a>
                                    <a th:href="@{/ui/print/quotation/{id}(id=${q.id})}" target="_blank"
                                       style="background:#0ea5e9; color:white; padding:4px 10px; border-radius:3px; text-decoration:none; font-size:11px; font-weight:bold;">
                                       🖨️
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <a th:href="@{/ui/sales/quotations/new}" 
                   style="background:#2563eb; color:white; padding:8px 20px; border-radius:4px; text-decoration:none; font-weight:bold;">
                   + New Quotation (SPH)
                </a>
            </div>
        </section>
    </main>
</div>

<script>
    document.getElementById('searchInput').addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        document.querySelectorAll('#qTable tbody tr').forEach(row => {
            if (row.cells.length > 1) {
                row.style.display = row.innerText.toLowerCase().includes(filter) ? '' : 'none';
            }
        });
    });
</script>
</body>
</html>
