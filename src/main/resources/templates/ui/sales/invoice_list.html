<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3 style="margin-top:0; margin-bottom:10px;">[Sales] Invoices</h3>
                <div th:if="${success}" class="success-msg" th:text="${success}"></div>
                <div th:if="${error}" class="error-msg" th:text="${error}"></div>
                <table class="erp-table" style="margin-bottom: 15px;">
                    <thead>
                        <tr><th style="width: 30px;"></th><th>No. Invoice</th><th>Date</th><th>Due Date</th><th>Currency</th><th style="text-align:right;">Total Amount</th><th>Coretax</th><th>Status</th><th>Aksi</th><th>Aksi</th></tr>
                    </thead>
                    <tbody>
                        <tr th:if="${invoices.isEmpty()}"><td colspan="7" class="center" style="padding:20px;">Belum ada tagihan.</td></tr>
                        <tr th:each="i : ${invoices}" onclick="selectRow(this)" style="cursor: pointer;">
                            <td class="center"><input type="radio" name="selRow" th:value="${i.id}"></td>
                            <td><strong th:text="${i.docNo}"></strong></td>
                            <td th:text="${#temporals.format(i.docDate, 'dd-MM-yyyy')}"></td>
                            <td th:text="${#temporals.format(i.dueDate, 'dd-MM-yyyy')}"></td>
                            <td th:text="${i.currency} ?: 'IDR'"></td>
                            <td style="text-align:right; font-weight:bold;" th:text="${#numbers.formatDecimal(i.totalAmount, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td>
        <span th:if="${i.coretaxStatus == 'SUCCESS'}" style="color:green; font-size:11px;" th:text="'OK: ' + ${i.nsfp}"></span>
        <span th:if="${i.coretaxStatus == 'PENDING'}" style="color:orange; font-size:11px;">Belum Dikirim</span>
        <span th:if="${i.coretaxStatus == 'FAILED'}" style="color:red; font-size:11px;">Gagal</span>
     </td>
     <td><span class="badge" th:text="${i.status}"></span></td>
<td>
    <button th:if="${i.status != 'VOID'}" class="erp-btn-sm" style="background:#dc2626; padding:2px 8px;" th:attr="onclick='actionVoid(' + ${i.id} + ')'">Void</button>
</td>
<td>
        <a th:if="${i.status == 'DRAFT'}" th:href="@{/ui/sales/invoices/{id}/edit(id=${i.id})}" class="erp-btn-sm" style="background:#3b82f6; padding:2px 8px; text-decoration:none;">Change</a>
        
        <form th:if="${i.status == 'DRAFT'}" th:action="@{/ui/sales/invoices/{id}/post(id=${i.id})}" method="post" style="display:inline; margin:0; margin-left:2px;">
            <button type="submit" class="erp-btn-sm" style="background:#10b981; padding:2px 8px;" onclick="return confirm('Posting Invoice?')">Post</button>
        </form>
        
        <form th:if="${i.status == 'POSTED'}" th:action="@{/ui/sales/invoices/{id}/unpost(id=${i.id})}" method="post" style="display:inline; margin:0; margin-left:2px;">
            <button type="submit" class="erp-btn-sm" style="background:#f59e0b; padding:2px 8px;" onclick="return confirm('Unpost Invoice? Jurnal pembalik akan dibuat.')">Unpost</button>
        </form>

        <button th:if="${i.status != 'VOID'}" class="erp-btn-sm" style="background:#dc2626; padding:2px 8px; margin-left:2px;" th:attr="|actionVoid('${i.id}')|">Void</button>
    </td>
                        </tr>
                    </tbody>
                </table>
     <div style="margin-top: 15px;">
        <form th:if="${i.status == 'POSTED' and i.coretaxStatus != 'SUCCESS'}" th:action="@{'/ui/sales/invoices/' + ${i.id} + '/coretax'}" method="post" style="margin:0;">
            <button type="submit" class="erp-btn-sm" style="background:#10b981; padding:5px 15px;" onclick="return confirm('Kirim faktur ini ke Coretax?')">Submit Coretax</button>
        </form>
     </div>
            </div>
        </section>
    </main>
</div>
<script>
    function actionVoid(id) {
        if(confirm('Void Invoice ini? Jurnal pembalik akan dibuat otomatis.')) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/api/ui/sales/invoices/' + id + '/void';
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>
</body>
</html>
