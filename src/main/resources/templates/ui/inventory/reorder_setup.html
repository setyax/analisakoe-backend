<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px;">
                <h3 style="margin-top:0;">[Inventory] Setup Reorder Point</h3>
                <div th:if="${success}" class="success-msg" th:text="${success}"></div>
                <form th:action="@{/ui/inventory/reorder-point/setup}" method="post">
                    <table class="erp-table" style="width:100%;">
                        <thead>
                            <tr style="background-color:#1e293b; color:white;">
                                <th>Kode</th>
                                <th>Nama Barang</th>
                                <th style="width:130px;">Reorder Point</th>
                                <th style="width:130px;">Min Stock</th>
                                <th style="width:90px; text-align:center;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="i : ${items}">
                                <input type="hidden" name="itemId" th:value="${i.id}">
                                <td><strong th:text="${i.code}"></strong></td>
                                <td th:text="${i.name}"></td>
                                <td><input type="number" name="reorderPoint" step="any" min="0" th:value="${i.reorderPoint}" style="width:100%; padding:5px; text-align:right;"></td>
                                <td><input type="number" name="minStock" step="any" min="0" th:value="${i.minStock}" style="width:100%; padding:5px; text-align:right;"></td>
                                <td style="text-align:center;">
                                    <form th:action="@{/ui/inventory/reorder-point/{itemId}/clear(itemId=${i.id})}" method="post" style="margin:0;"
                                          onsubmit="return confirm('Reset Reorder Point & Min Stock item ini ke 0?')">
                                        <button type="submit" style="background:#ef4444; color:white; border:none; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">Reset</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div style="margin-top:20px;">
                        <button type="submit" class="erp-btn erp-btn-primary">Save Setup</button>
                        <a th:href="@{/ui/inventory/reorder-point}" class="erp-btn" style="text-decoration:none;">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
