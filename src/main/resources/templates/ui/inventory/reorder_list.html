<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container" style="padding:20px; background:#fff; border-radius:8px;">
                <h3 style="margin-top:0;">[Inventory] Reorder Point Alert</h3>
                <p style="color:#64748b;">Daftar barang yang stoknya sudah menyentuh batas minimum. Segera buat Purchase Request!</p>
                <div th:if="${error}" class="error-msg" th:text="${error}"></div>
                <a th:href="@{/ui/inventory/reorder-point/setup}" class="erp-btn" style="background:#3b82f6; color:white; padding:8px 15px; text-decoration:none; display:inline-block; margin-bottom:15px;">⚙ Setup Reorder Point</a>
                <table class="erp-table" style="width:100%;">
                    <thead>
                        <tr style="background-color:#dc2626; color:white;">
                            <th>Kode</th>
                            <th>Nama Barang</th>
                            <th>UOM</th>
                            <th style="text-align:right;">Stok Saat Ini</th>
                            <th style="text-align:right;">Reorder Point</th>
                            <th style="text-align:right;">Min Stock</th>
                            <th style="text-align:right;">Saran Pesan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="7" style="text-align:center; padding:20px; color:green;">✅ Semua stok aman! Tidak ada yang perlu dipesan.</td>
                        </tr>
                        <tr th:each="i : ${items}" style="border-bottom:1px solid #eee;">
                            <td><strong th:text="${i.code}"></strong></td>
                            <td th:text="${i.name}"></td>
                            <td th:text="${i.uom}"></td>
                            <td style="text-align:right; color:red; font-weight:bold;" th:text="${i.currentStock.stripTrailingZeros().toPlainString()}"></td>
                            <td style="text-align:right;" th:text="${i.reorderPoint.stripTrailingZeros().toPlainString()}"></td>
                            <td style="text-align:right;" th:text="${i.minStock.stripTrailingZeros().toPlainString()}"></td>
                            <td style="text-align:right; font-weight:bold; background:#fef3c7;" th:text="${i.suggestedOrder.stripTrailingZeros().toPlainString()}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
