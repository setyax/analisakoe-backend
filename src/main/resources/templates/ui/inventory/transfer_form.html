<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <h3>[Inventory] New Stock Transfer</h3>
                <form th:action="@{/ui/inventory/transfers}" method="post">
                    <div class="erp-form-grid" style="margin-bottom:20px;">
                        <label>Tanggal:</label> <input type="date" name="transferDate" th:value="${today}" required>
                        <label>Dari Gudang:</label> 
                        <select name="fromWarehouseId" required>
                            <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                        </select>
                        <label>Ke Gudang:</label> 
                        <select name="toWarehouseId" required>
                            <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                        </select>
                        <label>Keterangan:</label> <input type="text" name="remarks">
                    </div>
                    
                    <table class="erp-table" id="itemTable">
                        <thead>
                            <tr><th>Item</th><th>Qty</th><th>UOM</th><th>X</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <select name="itemId" required style="width:100%;">
                                        <option th:each="i : ${items}" th:value="${i.id}" th:text="${i.name}"></option>
                                    </select>
                                </td>
                                <td><input type="number" name="qty" step="any" min="0.01" required style="width:100px;"></td>
                                <td>
                                    <select name="uomId" required style="width:100%;">
                                        <option th:each="u : ${uoms}" th:value="${u.id}" th:text="${u.code}"></option>
                                    </select>
                                </td>
                                <td><button type="button" onclick="this.closest('tr').remove()">X</button></td>
                            </tr>
                        </tbody>
                    </table>
                    <button type="button" onclick="addRow()" style="margin-top:10px;">+ Add Row</button>
                    <br><br>
                    <button type="submit" class="erp-btn erp-btn-primary">Save Transfer</button>
                    <a th:href="@{/ui/inventory/transfers}" class="erp-btn">Cancel</a>
                </form>
            </div>
        </section>
    </main>
</div>
<script>
    function addRow() {
        const tbody = document.querySelector('#itemTable tbody');
        const tr = tbody.querySelector('tr').cloneNode(true);
        tr.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
        tr.querySelectorAll('input').forEach(i => i.value = '');
        tbody.appendChild(tr);
    }
</script>
</body>
</html>
