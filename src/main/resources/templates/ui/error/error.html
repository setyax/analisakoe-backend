<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oops! Terjadi Kesalahan</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .error-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; border: 1px solid #e2e8f0; }
        h1 { color: #ef4444; font-size: 48px; margin: 0 0 10px 0; }
        h2 { color: #1e293b; margin: 0 0 20px 0; }
        p { color: #64748b; margin-bottom: 30px; line-height: 1.6; }
        a { background: #3b82f6; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        a:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1 th:text="${status} ?: '500'">500</h1>
        <h2 th:text="${error} ?: 'Internal Server Error'">Internal Server Error</h2>
        <p th:text="${message} ?: 'Terjadi kesalahan pada sistem. Silakan kembali ke halaman utama atau hubungi administrator.'"></p>
        <a th:href="@{/ui/dashboard}">Kembali ke Dashboard</a>
    </div>
</body>
</html>
