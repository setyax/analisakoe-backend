<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <section class="app-content">
            <div class="erp-container">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px;">
                    <div>
                        <h3 style="margin:0 0 4px 0;">Unit of Measure Master</h3>
                        <p style="margin:0; color:#64748b; font-size:13px;">Maintain the standard units used on item and transaction records.</p>
                    </div>
                    <a th:href="@{/ui/uoms/new}" class="erp-btn erp-btn-primary" style="text-decoration:none;">+ Add UOM</a>
                </div>

                <div th:if="${success}" class="success-msg" th:text="${success}"></div>
                <div th:if="${error}" class="error-msg" th:text="${error}"></div>

                <form th:action="@{/ui/uoms}" method="get" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px 0;">
                    <input type="search" name="q" th:value="${q}" placeholder="Search UOM name..." aria-label="Search UOM name" style="max-width:320px; margin:0;">
                    <button type="submit" class="erp-btn erp-btn-primary">Search</button>
                    <a th:href="@{/ui/uoms}" class="erp-btn" style="background:#e2e8f0; color:#334155; text-decoration:none;">Reset</a>
                </form>

                <div style="overflow-x:auto;">
                    <table class="erp-table">
                        <thead>
                        <tr>
                            <th style="width:180px;">UOM Code</th>
                            <th>UOM Name</th>
                            <th style="width:150px;">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(uoms.content)}">
                            <td colspan="3" style="text-align:center; padding:24px; color:#64748b;">No unit of measure records found.</td>
                        </tr>
                        <tr th:each="u : ${uoms.content}">
                            <td><strong th:text="${u.code}">PCS</strong></td>
                            <td th:text="${u.name}">Pieces</td>
                            <td style="white-space:nowrap;">
                                <a th:href="@{/ui/uoms/{id}/edit(id=${u.id})}" class="erp-btn-sm" style="background:#dbeafe;color:#1d4ed8;text-decoration:none;">Edit</a>
                                <button type="button" class="erp-btn-sm" style="background:#fee2e2;color:#b91c1c;" th:attr="data-delete-url=@{/ui/uoms/{id}(id=${u.id})}" onclick="deleteMasterRecord(this, 'UOM')">Delete</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
<script>
async function deleteMasterRecord(button, label) {
    if (!confirm('Delete this ' + label + '? This action cannot be undone.')) return;
    button.disabled = true;
    try {
        const response = await fetch(button.dataset.deleteUrl, {
            method: 'DELETE',
            credentials: 'same-origin',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        if (!response.ok || response.redirected) {
            throw new Error('Delete failed (HTTP ' + response.status + '). Please refresh and try again.');
        }
        window.location.reload();
    } catch (error) {
        alert(error.message || 'Unable to delete this record.');
        button.disabled = false;
    }
}
</script>
</body>
</html>
